<style>
  :root{
    /* ── Токены под тему «подводный аквариум» (бумажный HUD + чернильный контур серии) ── */
    --ink:#233A4E; --ink-soft:#6E8A9C; --line:#2B4358;
    --paper:#FBF6E9;
    --accent:#FF9E5A; --accent-deep:#E87A38;
    --gold:#F2C14E; --mint:#7FD1AE; --lav:#B9A3E3; --sky:#5B9BD5;
    --bg:#2C7FA6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(35,58,78,.28)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(35,58,78,.28);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .rbtn svg{width:27px;height:27px;display:block}
  .bottom{display:flex;gap:10px;pointer-events:auto}
  .abtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(35,58,78,.28);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .abtn .bt{font-size:15px;line-height:1.05}
  .abtn .bs{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  .abtn.main{background:var(--accent);border-color:var(--accent-deep)}
  .abtn.blue{background:var(--sky);border-color:#3E77AD}
  .abtn.lav{background:var(--lav);border-color:#8E76C0}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── полоса цели (задание смотрителя) ── */
  #goalBar{margin-top:8px;align-self:stretch;max-width:340px;pointer-events:auto;cursor:default;
           background:var(--paper);border:2.5px solid var(--line);border-radius:14px;
           padding:6px 10px 7px;box-shadow:0 3px 0 rgba(35,58,78,.28)}
  #goalBar.done{background:var(--gold);border-color:#C99A22;cursor:pointer;
                animation:goalPulse 1.1s ease-in-out infinite}
  @keyframes goalPulse{0%,100%{box-shadow:0 3px 0 rgba(35,58,78,.28)}
                       50%{box-shadow:0 3px 0 rgba(35,58,78,.28),0 0 0 4px rgba(242,193,78,.45)}}
  #goalBar .gtop{display:flex;align-items:baseline;gap:8px}
  #goalBar .gn{flex:1;min-width:0;font-size:12.5px;font-weight:900;line-height:1.15;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #goalBar .gr{font-size:11.5px;font-weight:900;color:var(--accent-deep);white-space:nowrap}
  #goalBar.done .gr{color:var(--ink)}
  #goalBar .gtrack{height:7px;margin-top:5px;border-radius:99px;background:rgba(35,58,78,.15);overflow:hidden}
  #goalBar .gfill{height:100%;width:0;border-radius:99px;background:var(--mint);transition:width .3s}
  #goalBar.done .gfill{background:var(--ink)}
  /* ── модалка (магазин/апгрейды/коллекция) ── */
  #modal{position:absolute;inset:0;background:rgba(20,40,58,.55);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:5;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBF1DA);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(20,40,58,.3)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(35,58,78,.28)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(35,58,78,.18)}
  .row .thumb{width:52px;height:44px;flex:none;background:#EAF4F7;border:2px solid var(--line);border-radius:11px}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(35,58,78,.25);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5FB893}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(35,58,78,.18)}
  .card canvas{width:78px;height:56px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:12px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:56px;line-height:56px}
  /* ── низкий экран (альбом 640x360): четвёртая кнопка не должна уезжать за край ── */
  @media (max-height:520px){
    #side{top:84px;gap:8px}
    .rbtn{width:46px;height:46px}
    .rbtn svg{width:24px;height:24px}
  }
  /* ── скрытые элементы / гейт готовности (GameReady уходит раньше показа UI) ── */
  .gone{display:none!important}
  body:not(.ready) #hud,body:not(.ready) #side{opacity:0;pointer-events:none}
  /* ── строки окон возвращения / престижа ── */
  .hint{font-size:12.5px;font-weight:800;color:var(--ink-soft);line-height:1.35;margin:0 2px 10px}
  .hint.warn{color:var(--accent-deep)}
  .orow{display:flex;align-items:center;justify-content:space-between;gap:10px;
        background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;
        padding:8px 12px;margin-bottom:7px;box-shadow:0 2px 0 rgba(35,58,78,.18)}
  .orow .on{font-weight:900;font-size:14px}
  .orow .ov{font-weight:900;font-size:15px;color:var(--accent-deep)}
  .orow.total{background:var(--gold);border-color:#C99A22}
  .orow.total .ov,.orow.total .on{color:var(--ink)}
  /* ── ежедневная серия ── */
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:4px}
  .dcell{background:#FFF8E6;border:2.5px solid var(--line);border-radius:12px;
         padding:7px 3px;text-align:center;box-shadow:0 2px 0 rgba(35,58,78,.18)}
  .dcell .dn{font-size:10.5px;font-weight:800;color:var(--ink-soft)}
  .dcell .dv{font-size:12.5px;font-weight:900;margin-top:2px}
  .dcell.done{opacity:.5}
  .dcell.now{background:var(--gold);border-color:#C99A22;transform:scale(1.04)}
  /* ── кнопки действий в окне ── */
  #mAct{display:flex;gap:9px;margin-top:12px}
  #mAct:empty{display:none}
  .mbtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:14px;
        padding:11px 8px;font-family:inherit;font-weight:900;font-size:14px;color:var(--ink);
        cursor:pointer;box-shadow:0 3px 0 rgba(35,58,78,.28)}
  .mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .mbtn.main{background:var(--accent);border-color:var(--accent-deep);color:#fff}
  /* ── контекстная подсказка ── */
  /* Ширина задана явно: при fixed+left+translate(-50%) браузер считает ширину из
     остатка места справа от left ДО применения transform, и у кнопки в правом
     краю экрана текст схлопывается в колонку по слову. */
  #tip{position:fixed;width:230px;z-index:20;background:var(--paper);color:var(--ink);
       border:2.5px solid var(--line);border-radius:14px;padding:9px 11px;
       font-size:12.5px;font-weight:800;line-height:1.3;text-align:left;
       box-shadow:0 4px 0 rgba(35,58,78,.28);pointer-events:none;
       opacity:0;transition:opacity .2s;transform:translate(-50%,-100%)}
  #tip.on{opacity:1}
  #tip.side{transform:translate(-100%,-50%)}
  .rbtn.ready{border-color:var(--accent-deep);box-shadow:0 0 0 3px rgba(242,193,78,.55),0 3px 0 rgba(35,58,78,.28)}
  .tipTarget{position:relative;z-index:16;outline:3px solid var(--gold);outline-offset:2px;
             border-radius:16px;animation:tipPulse 1.2s ease-in-out infinite}
  @keyframes tipPulse{0%,100%{outline-color:var(--gold)}50%{outline-color:rgba(242,193,78,.35)}}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
'use strict';
// ============================================================
//  Тёплый Аквариум / Cozy Aquarium — idle-коллекционер про уютный аквариум
//  Петля: покормить (тап-доход) -> накопить жемчуг -> завести новую рыбку
//  (плавает, даёт пассивный доход) -> апгрейды. Живой подводный мир.
// ============================================================
const SAVE_KEY = "cozy_aquarium_v1";        // GAME: уникальный ключ сейва
const LB_NAME  = "species";                  // техимя лидерборда (рекорд = число видов)
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// Автоопределённый язык нигде не сохраняем — иначе он перекроет язык платформы.
let platLang = null;
function readPlatformLang(){
  try{ const l = ysdk && ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang;
       if(l) platLang = (l==="ru" ? "ru" : "en"); }catch(e){}
  return platLang;
}
function lang(){
  if(platLang) return platLang;
  return (navigator.language||"ru").slice(0,2)==="ru" ? "ru" : "en";
}

  coins:{ru:"ЖЕМЧУГ",en:"PEARLS"}, income:{ru:"ДОХОД",en:"INCOME"},

  dayGot:{ru:"Забрано:",en:"Collected:"},
  // ── престиж ──
  presTitle:{ru:"Пересадить аквариум",en:"Replant the tank"},
  presWhat:{ru:"Рыбки уезжают в большой пруд, а тебе остаются кораллы — они дают постоянную прибавку к доходу и не пропадают никогда.",
            en:"The fish move to a big pond and leave you corals — a permanent income bonus that never resets."},
  presGet:{ru:"Ты получишь: +{n} 🪸",en:"You will get: +{n} 🪸"},

const T = (k,vars) => { let s=(STR[k]||{})[lang()] || (STR[k]||{}).ru || k;
  if(vars) for(const key in vars) s=String(s).replace("{"+key+"}", vars[key]); return s; };

// ---------- Виды рыб (0-й — стартовый, заведён сразу) ----------
// Кривая: доход ×1,6–1,75 за ступень, цена ×3,0–3,6. Цена держится в районе
// 5–20 минут текущего дохода игрока, поэтому интервал между покупками растёт
// плавно (30 с в начале → 10–30 мин в поздней игре), а не схлопывается.
const SPECIES = [
  {id:'guppy', ru:'Пузырик', en:'Bubbly',   c1:'#F2A65A', c2:'#FFDDAF', shape:'guppy',  ips:1,    cost:0},

  {id:'molly', ru:'Уголёк',  en:'Ember',    c1:'#4A4A57', c2:'#9AA0AC', shape:'molly',  ips:12,   cost:2600},
  {id:'tang',  ru:'Небо',    en:'Sky',      c1:'#3E7CC4', c2:'#F2C14E', shape:'tang',   ips:20,   cost:9000},

  {id:'angel', ru:'Королёк', en:'Regal',    c1:'#F0E6C4', c2:'#4A6377', shape:'angel',  ips:58,   cost:100000},
  {id:'puffer',ru:'Пуфик',   en:'Puffy',    c1:'#C7D66B', c2:'#EEF5C6', shape:'puffer', ips:100,  cost:330000},
  {id:'carm',  ru:'Кармин',  en:'Carmine',  c1:'#E0555F', c2:'#FFD5C2', shape:'tang',   ips:170,  cost:1100000},
  {id:'lunar', ru:'Лунник',  en:'Lunar',    c1:'#DCE6F5', c2:'#8FA8CC', shape:'angel',  ips:290,  cost:3600000},
  {id:'abyss', ru:'Глубик',  en:'Abyss',    c1:'#3A2E63', c2:'#7FE3E8', shape:'puffer', ips:500,  cost:12000000},
];
const SP = id => SPECIES.find(s=>s.id===id);
const KNOWN = SPECIES.map(s=>s.id);

// ---------- Состояние ----------
function fresh(){ return {
  v:2, coins:0, lifetime:0,                 // lifetime — суммарный заработок, метрика прогресса
  fish:['guppy'], seen:['guppy'],           // заведённые виды / обнаруженные для коллекции
  feed:0, aer:0, plant:0,                   // уровни апгрейдов
  corals:0, coralsGiven:0, resets:0,        // премиальная валюта: выдано всего / пересадок
  best:1,                                   // рекорд числа видов (лидерборд)
  x2Until:0, lastGift:0,                    // таймеры rewarded
  dailyDay:"", streak:0,                    // ежедневная серия (по строке даты)
  goal:0,                                   // номер текущего задания смотрителя
  tips:{}, flags:{},                        // показанные подсказки / разовые события
  time:Date.now()
};}
let S = fresh();

// ---------- Экономика ----------
const FEED_MAX=8, PLANT_MAX=8;
const x2On       = () => Date.now() < S.x2Until;
const prestigeMult = () => 1 + CORAL_MULT*S.corals; // внутри источника — сложение (затухание)
const aerMult    = () => 1 + 0.25*S.aer;
const ipsBase    = () => S.fish.reduce((a,id)=>{ const s=SP(id); return a + (s?s.ips:0); }, 0);
// ipsCalm — доход БЕЗ временных множителей. Всё, что считается «навсегда»
// (офлайн, размер подарка, прогноз), берёт его, иначе ×2 за ролик размножается.
const ipsCalm    = () => ipsBase() * aerMult() * prestigeMult();
const ips        = () => Math.max(0, ipsCalm() * (x2On()?2:1));
const tapGain    = () => Math.max(1+S.feed, ips() * (0.12 + 0.03*S.feed));
const priceMult  = () => Math.max(0.6, 1 - 0.05*S.plant);
const fishCost   = sp => Math.max(1, Math.floor(sp.cost * priceMult()));
const nextFish   = () => SPECIES.find(s=> !S.fish.includes(s.id));
const feedCost   = () => S.feed >=FEED_MAX  ? Infinity : Math.floor(25*Math.pow(2.2, S.feed));
const aerCost    = () => Math.floor(60*Math.pow(1.7, S.aer));
const plantCost  = () => S.plant>=PLANT_MAX ? Infinity : Math.floor(100*Math.pow(1.9, S.plant));
// для базового тест-хука: lvl = число видов, upCost = цена следующей рыбки
const upCost     = () => { const n=nextFish(); return n? fishCost(n) : 0; };

// Две функции вместо флага: подарки НЕ идут в метрики прогресса, иначе
// подарки ускоряют престиж, престиж раздувает доход, доход — следующие подарки.
function earn(n){  n=Math.max(0,n||0); S.coins+=n; S.lifetime+=n; return n; }
function grant(n){ n=Math.max(0,n||0); S.coins+=n; return n; }

// ---------- Престиж («пересадить аквариум») ----------
const CORAL_BASE = 1500000, CORAL_MULT = 0.25;
const coralsFor     = e => Math.floor(Math.sqrt(Math.max(0,e)/CORAL_BASE));   // сублинейно
const coralsPending = () => Math.max(0, coralsFor(S.lifetime) - S.coralsGiven);
const prestigeReady = () => coralsPending() >= 1 && S.fish.length >= 5;
function doPrestige(){
  const got = coralsPending();
  if(got < 1 || S.fish.length < 5) return false;
  S.corals += got; S.coralsGiven += got; S.resets++;
  // lifetime НЕ обнуляем и coralsGiven храним отдельно — иначе каждая пересадка
  // выдавала бы кораллы заново за одни и те же заслуги.
  S.coins=0; S.fish=['guppy']; S.feed=0; S.aer=0; S.plant=0; S.x2Until=0;
  rebuildSwimmers(); closeModal(); refreshHud(); persist(true); sfx('buy');
  toast(T('presDone',{n:got}));
  // Первая пересадка — лучшая точка в игре для запроса оценки; на последующих
  // это уже естественная пауза «конца забега», куда уместна межстраничная.
  if(S.resets===1) maybeAskReview(); else showInterstitial();
  return true;
}

// ---------- Задания смотрителя ----------
// Цель на экране всегда одна и всегда ближайшая: игрок видит, зачем он
// копит жемчуг прямо сейчас, а не «когда-нибудь потом». Награда — grant:
// задание не должно разгонять престиж, иначе петля замыкается сама на себя.
// После списка идёт бесконечная ветка по суммарному заработку — цель не кончается.
const goalCoins = sec => Math.max(120, Math.round(ipsCalm()*sec));
const GOALS = [
  { id:'f2',   text:()=>T('gFish2'),                      need:()=>2,  cur:()=>S.fish.length,  rew:()=>({coins:goalCoins(40)}) },
  { id:'feed1',text:()=>T('gFeed',{n:1}),                 need:()=>1,  cur:()=>S.feed,         rew:()=>({coins:goalCoins(50)}) },
  { id:'f3',   text:()=>T('gFish',{n:3}),                 need:()=>3,  cur:()=>S.fish.length,  rew:()=>({coins:goalCoins(60)}) },
  { id:'aer2', text:()=>T('gAer',{n:2}),                  need:()=>2,  cur:()=>S.aer,          rew:()=>({coins:goalCoins(70)}) },
  { id:'f5',   text:()=>T('gFish',{n:5}),                 need:()=>5,  cur:()=>S.fish.length,  rew:()=>({coins:goalCoins(90)}) },
  { id:'ips50',text:()=>T('gIps',{n:50}),                 need:()=>50, cur:()=>ipsCalm(),      rew:()=>({coins:goalCoins(110)}) },
  { id:'pl3',  text:()=>T('gPlant',{n:3}),                need:()=>3,  cur:()=>S.plant,        rew:()=>({coins:goalCoins(120)}) },
  { id:'f7',   text:()=>T('gFish',{n:7}),                 need:()=>7,  cur:()=>S.fish.length,  rew:()=>({coins:goalCoins(140)}) },
  { id:'ips5c',text:()=>T('gIps',{n:500}),                need:()=>500,cur:()=>ipsCalm(),      rew:()=>({coins:goalCoins(160)}) },
  { id:'pres1',text:()=>T('gPres'),                       need:()=>1,  cur:()=>S.resets,       rew:()=>({coins:goalCoins(180), corals:1}) },
  { id:'f9',   text:()=>T('gFish',{n:9}),                 need:()=>9,  cur:()=>S.fish.length,  rew:()=>({coins:goalCoins(200)}) },
  { id:'all',  text:()=>T('gAll',{n:SPECIES.length}),     need:()=>SPECIES.length, cur:()=>S.seen.length, rew:()=>({coins:goalCoins(240), corals:2}) },
];
const LIFE_BASE = 30000000;                 // первая бесконечная цель — чуть за первой пересадкой
function goalDef(){
  const i = S.goal;
  if(i < GOALS.length) return GOALS[i];
  // Кламп: на больших номерах степень уходит в Infinity, и цель перестаёт быть целью.
  const n = Math.round(Math.min(Number.MAX_SAFE_INTEGER, LIFE_BASE * Math.pow(6, i - GOALS.length)));
  return { id:'life'+(i-GOALS.length), endless:true,
           text:()=>T('gLife',{n:fmt(n)}), need:()=>n, cur:()=>S.lifetime,
           rew:()=>({coins:goalCoins(260), corals:1}) };
}
const goalReady = () => { const g=goalDef(); return g.cur() >= g.need(); };
function claimGoal(){
  const g=goalDef(); if(g.cur() < g.need()) return false;
  const r=g.rew();
  const c=grant(r.coins);                   // награда — подарок, не производство
  if(r.corals) S.corals += r.corals;        // отдельный источник: coralsGiven не трогаем
  S.goal++;
  refreshHud(); persist(true); sfx('coin');
  toast(T('goalDone')+" +"+fmt(c)+(r.corals?" +"+r.corals+" 🪸":""));
  return true;
}
// Старые сейвы: уже выполненное проматываем без наград — иначе действующий
// игрок при первом запуске получит десяток наград подряд за старые заслуги.
function skipDoneGoals(){
  let guard=0;
  while(goalReady() && guard++ < 64) S.goal++;
}

// ---------- Офлайн-доход ----------
// Три НЕЗАВИСИМЫХ порога. CAP обязан быть больше REPORT, иначе появляется мёртвая
// зона: вернувшийся между ними получает максимум, но окна не видит.
const OFF_MIN=60, OFF_CAP=8*3600, OFF_REPORT=4*3600, OFF_MULT=0.5;
function offlineFor(sec){
  const t = Math.min(Math.max(0, sec), OFF_CAP);
  return { sec:t, away:sec, capped: sec > OFF_CAP, amount: Math.floor(ipsCalm()*OFF_MULT*t) };
}
function applyOffline(sec){
  const r = offlineFor(sec);
  if(r.amount > 0) earn(r.amount);        // это настоящее производство, а не подарок
  S.flags.sawOffline = true;
  return r;
}
function humanTime(sec){
  const h=Math.floor(sec/3600), m=Math.round((sec%3600)/60);
  return h>0 ? (h+" "+T('hShort')+(m?" "+m+" "+T('mShort'):"")) : (Math.max(1,m)+" "+T('mShort'));
}

// ---------- Сейвы (throttle + облако, фолбэк localStorage) ----------
function serialize(){
  S.time=Date.now();
  S.coins=Math.round(S.coins*100)/100; S.lifetime=Math.round(S.lifetime*100)/100;
  return JSON.stringify(S);
}
function persist(force){
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  const raw=serialize();
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}); }catch(e){} }
}
// Дожим при уходе со страницы: setData копит запись и может не успеть уйти.
// Свой троттл 3 с — иначе дёрганое переключение вкладок сожжёт лимит (100/5 мин).
let flushT=0;
function saveNow(){
  const now=Date.now(); if(now-flushT<3000) return; flushT=now; saveT=now;
  const raw=serialize();
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}, true); }catch(e){} }
}
const numOr = (v,d) => Number.isFinite(v) ? v : d;
const intIn = (v,lo,hi,d) => Number.isFinite(v) ? Math.max(lo, Math.min(hi, Math.floor(v))) : d;
function restore(raw){
  let d=null;
  try{ d = (typeof raw==="string") ? JSON.parse(raw) : (raw && raw.save ? JSON.parse(raw.save) : raw); }
  catch(e){ d=null; }
  const s = fresh();          // разбираем в чистое состояние: при ошибке отдаём его же,
  if(!d || typeof d!=="object"){ S=s; return; }   // а не наполовину слитый объект
  s.coins    = Math.max(0, numOr(d.coins, 0));
  s.feed     = intIn(d.feed, 0, FEED_MAX, 0);
  s.aer      = intIn(d.aer, 0, 200, 0);
  s.plant    = intIn(d.plant, 0, PLANT_MAX, 0);
  s.corals   = Math.max(0, intIn(d.corals, 0, 1e9, 0));
  s.resets   = Math.max(0, intIn(d.resets, 0, 1e9, 0));
  s.x2Until  = Math.max(0, numOr(d.x2Until, 0));
  s.lastGift = Math.max(0, numOr(d.lastGift, 0));
  s.time     = numOr(d.time, Date.now());
  s.dailyDay = (typeof d.dailyDay==="string") ? d.dailyDay : "";
  s.streak   = intIn(d.streak, 0, 7, 0);
  s.goal     = intIn(d.goal, 0, 999, 0);
  s.tips     = (d.tips  && typeof d.tips ==="object" && !Array.isArray(d.tips))  ? d.tips  : {};
  s.flags    = (d.flags && typeof d.flags==="object" && !Array.isArray(d.flags)) ? d.flags : {};
  // Незнакомый id вида — это «ничего», а не «самый дорогой»: сейв мог прийти
  // с другого устройства из будущей версии, и подрезка к границе таблицы
  // выдала бы самую дорогую рыбку бесплатно.
  const clean = a => Array.isArray(a) ? a.filter((x,i,arr)=> KNOWN.includes(x) && arr.indexOf(x)===i) : [];
  s.fish = clean(d.fish); if(!s.fish.length) s.fish=['guppy'];
  if(!s.fish.includes('guppy')) s.fish.unshift('guppy');
  s.seen = clean(d.seen);
  s.fish.forEach(id=>{ if(!s.seen.includes(id)) s.seen.push(id); });
  s.best = Math.max(1, intIn(d.best, 1, 1e6, 1), s.seen.length);
  // Миграция сейвов без метрики суммарного заработка: считаем её от того, что
  // у игрока уже есть, и сразу помечаем кораллы выданными — иначе действующие
  // игроки при первом же запуске получат пачку премиальной валюты за прошлое.
  if(Number.isFinite(d.lifetime)){
    s.lifetime    = Math.max(0, d.lifetime);
    s.coralsGiven = Math.max(0, intIn(d.coralsGiven, 0, 1e9, 0));
  } else {
    let est = s.coins;
    s.fish.forEach(id=>{ const sp=SP(id); if(sp) est += sp.cost; });
    for(let i=0;i<s.feed;i++)  est += Math.floor(25*Math.pow(2.2,i));
    for(let i=0;i<s.aer;i++)   est += Math.floor(60*Math.pow(1.7,i));
    for(let i=0;i<s.plant;i++) est += Math.floor(100*Math.pow(1.9,i));
    s.lifetime = est;
    s.coralsGiven = coralsFor(est);
  }
  S = s;
  if(!Number.isFinite(d.goal)) skipDoneGoals();
}

// ---------- Реклама ----------
// Rewarded: ролик стартует только по явному нажатию, звук глушится на время
// показа (страница фокус не теряет, поэтому visibilitychange тут не помогает),
// награда выдаётся ровно один раз — onError может прийти ПОСЛЕ onRewarded.
function showRewarded(onReward){
  if(!ysdk || !ysdk.adv || !ysdk.adv.showRewardedVideo){ onReward(); return; }
  let paid=false; const pay=()=>{ if(!paid){ paid=true; onReward(); } };
  try{
    ysdk.adv.showRewardedVideo({callbacks:{
      onOpen:     ()=>audioSuspend(),
      onRewarded: pay,
      onClose:    ()=>audioResume(),
      onError:    ()=>{ audioResume(); pay(); },
    }});
  }catch(e){ onReward(); }
}
// Межстраничная: частотой управляет площадка. Свою паузу считаем от ФАКТА
// показа (wasShown), при отказе возвращаемся раньше. Только в естественных
// паузах — во время активной игры случайные клики считаются фродом.
const AD_GAP_S=210, AD_WARMUP_S=90, AD_RETRY_S=45;
let nextAdAt=0, adBusy=false, bootedAt=0;
function adAllowed(){
  if(!booted || adBusy || !ysdk || !ysdk.adv || !ysdk.adv.showFullscreenAdv) return false;
  if(document.hidden) return false;
  if(Date.now() < nextAdAt) return false;
  if(Date.now() - bootedAt < AD_WARMUP_S*1000) return false;   // не встречаем игрока рекламой
  if(modalOpen || tipNow) return false;
  if(x2On()) return false;                                     // не рвём оплаченный бонус
  return true;
}
function showInterstitial(){
  if(!adAllowed()) return;
  adBusy=true;
  const finish = wasShown => { adBusy=false; audioResume();
    nextAdAt = Date.now() + (wasShown?AD_GAP_S:AD_RETRY_S)*1000; };
  try{
    ysdk.adv.showFullscreenAdv({callbacks:{
      onOpen:  ()=>audioSuspend(),
      onClose: was=>finish(!!was),
      onError: ()=>finish(false),
    }});
  }catch(e){ finish(false); }
}

// ---------- Лидерборд ----------
// sdk.leaderboards — новое поколение API (setScore). Метод setLeaderboardScore
// есть только у объекта из устаревшего getLeaderboards(); поддерживаем оба.
let lbT=0, authed=false;
function submitScore(v){
  v=Math.floor(v||0);
  if(!lb || !LB_NAME || v<=0 || !authed) return;       // нулевой результат не пишем
  const now=Date.now(); if(now-lbT<1000) return; lbT=now;   // лимит: 1 запись в секунду
  try{
    if(typeof lb.setScore==='function') lb.setScore(LB_NAME, v);
    else if(typeof lb.setLeaderboardScore==='function') lb.setLeaderboardScore(LB_NAME, v);
  }catch(e){}
}

// ---------- Инструменты удержания от площадки ----------
const scReward = () => Math.max(300, Math.floor(ipsCalm()*180));
async function maybeOfferShortcut(){
  if(S.flags.scAsked || !ysdk || !ysdk.shortcut || modalOpen) return;
  if(S.fish.length < 4) return;                    // предлагаем втянувшемуся, не на старте
  try{ const r = await ysdk.shortcut.canShowPrompt(); if(!r || !r.canShow) return; }catch(e){ return; }
  openModal('shortcut');
}
// showPrompt() открывает нативный диалог — без жеста игрока браузер его не покажет,
// поэтому зовём строго из обработчика нажатия по своей карточке.
async function askShortcut(){
  S.flags.scAsked = true; persist(true);
  try{
    const res = await ysdk.shortcut.showPrompt();
    if(res && res.outcome === 'accepted'){
      const g = grant(scReward()); sfx('coin'); toast(T('scGot',{n:fmt(g)}));
    }
  }catch(e){}
  closeModal(); refreshHud();
}
async function maybeAskReview(){
  if(S.flags.rvAsked || !ysdk || !ysdk.feedback) return;
  S.flags.rvAsked = true;                          // запросить можно раз за сессию
  try{
    const can = await ysdk.feedback.canReview();   // обязателен перед requestReview()
    if(can && can.value) await ysdk.feedback.requestReview();
  }catch(e){}
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const SUF = ["","K","M","B","T","Qa","Qi","Sx","Sp"];
const fmtRate = n => (n=Math.max(0,n||0), n<100 ? String(Math.round(n*10)/10) : fmt(n));
function fmt(n){
  n = Math.floor(n||0);
  if(n < 1000) return String(n);
  let x=n, i=0;
  while(x>=1000 && i<SUF.length-1){ x/=1000; i++; }
  return (x<10 ? x.toFixed(2) : x<100 ? x.toFixed(1) : String(Math.round(x))) + SUF[i];
}
const GIFT_CD = 90000;
const giftAmt  = () => Math.max(100, Math.floor(ipsCalm()*60));   // без ×2: множители не перемножаем
const giftLeft = () => Math.max(0, GIFT_CD - (Date.now()-S.lastGift));
function refreshHud(){
  $("coinsV").textContent = fmt(S.coins);
  $("ipsV").textContent   = fmtRate(ips())+"/"+(lang()==="ru"?"с":"s");
  $("coinsL").textContent = T("coins");
  $("ipsL").textContent   = T("income");
  $("tapT").textContent   = T("feed");
  $("coralChip").classList.toggle("gone", S.corals<=0);
  $("coralV").textContent = fmt(S.corals);
  $("coralL").textContent = T("corals");
  const gl = giftLeft();
  $("giftT").textContent  = T("gift");
  $("giftS").textContent  = gl>0 ? T("giftWait")+" "+Math.ceil(gl/1000)+"s" : "+"+fmt(giftAmt());
  $("giftBtn").classList.toggle("off", gl>0);
  const on=x2On();
  $("x2T").textContent    = on? T("x2on") : T("x2");
  $("x2S").textContent    = on? Math.ceil((S.x2Until-Date.now())/60000)+(lang()==="ru"?" мин":" min") : (lang()==="ru"?"5 мин":"5 min");
  $("x2Btn").classList.toggle("off", on);
  $("presBtn").classList.toggle("gone", !(S.corals>0 || prestigeReady()));
  $("presBtn").classList.toggle("ready", prestigeReady());
  refreshGoal();
  if(modalOpen==='fish' || modalOpen==='up') buildModal(modalOpen);  // живое обновление цен
}
function refreshGoal(){
  const g=goalDef(), need=g.need(), cur=Math.min(need, g.cur()), done=cur>=need;
  const bar=$("goalBar");
  bar.classList.toggle("done", done);
  $("goalT").textContent = done ? T('goalTake') : g.text();
  const r=g.rew();
  $("goalR").textContent = "+"+fmt(r.coins)+(r.corals?" +"+r.corals+" 🪸":"");
  // Цель вроде «доход 500/с» начинается не с нуля, поэтому шкала — простое cur/need:
  // честнее показать маленький хвостик, чем полосу «почти готово» на пустом месте.
  $("goalFill").style.width = Math.max(0, Math.min(100, 100*cur/need)) + "%";
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1800); }

// ---------- Действия ----------
function doFeed(x){
  earn(tapGain());
  spawnFood(x);
  refreshHud(); persist(); sfx("tap");
}
function buyFish(id){
  const sp=SP(id); if(!sp || S.fish.includes(id)) return false;
  const c=fishCost(sp);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S.fish.push(id);
  if(!S.seen.includes(id)) S.seen.push(id);
  S.best=Math.max(S.best,S.seen.length);
  spawnSwimmer(sp); refreshHud(); persist(true); submitScore(S.best); sfx("buy");
  toast(T("newFish")+" "+nm(sp));
  return true;
}
function buyUp(key){
  const map={feed:feedCost,aer:aerCost,plant:plantCost};
  const c=map[key](); if(!Number.isFinite(c) || S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function claimGift(){
  if(giftLeft()>0){ sfx("error"); return; }
  showRewarded(()=>{
    S.lastGift=Date.now();
    const g=grant(giftAmt());               // подарок — grant, не earn
    refreshHud(); persist(true); sfx("coin"); toast(T("giftGot")+" +"+fmt(g));
  });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{
    S.x2Until=Date.now()+300000; S.flags.usedX2=true;
    refreshHud(); persist(true); sfx("buy"); toast(T("x2got"));
  });
}

// ---------- Ежедневная серия ----------
// День определяем по строке даты, а не по таймстемпу: иначе «сутки» едут
// относительно того, во сколько игрок зашёл в первый раз.
const dayStr = ms => new Date(ms).toISOString().slice(0,10);
const dailyPending = () => S.dailyDay !== dayStr(Date.now());
const dailyIndex   = () => { const y=dayStr(Date.now()-86400000);
  return (S.dailyDay===y && S.streak<7) ? S.streak : 0; };            // 0..6
function dayReward(i){
  return { coins: Math.max(150, Math.round(ipsCalm()*60*(2+i))), corals: (i===2||i===6)?1:0 };
}
function claimDaily(x2){
  if(!dailyPending()) return;
  const i=dailyIndex(), r=dayReward(i);
  const give=()=>{
    const y=dayStr(Date.now()-86400000);
    S.streak  = (S.dailyDay===y && S.streak<7) ? S.streak+1 : 1;
    S.dailyDay= dayStr(Date.now());
    const c = grant(r.coins * (x2?2:1));      // ежедневка — тоже подарок
    if(r.corals) S.corals += r.corals;   // отдельный источник: coralsGiven не трогаем
    closeModal(); refreshHud(); persist(true); sfx("coin");
    toast(T("dayGot")+" +"+fmt(c)+(r.corals?" +"+r.corals+" 🪸":""));
  };
  if(x2) showRewarded(give); else give();
}

// ---------- Модалки: магазин / апгрейды / коллекция / окна ----------
let modalOpen=null;
function openModal(kind, data){ modalOpen=kind; modalData=data||null; buildModal(kind);
  $("modal").classList.remove("hidden"); if(tipNow) closeTip(); }
function closeModal(){
  const was=modalOpen; modalOpen=null; modalData=null;
  $("modal").classList.add("hidden"); $("mAct").innerHTML="";
  if(was==='offline') showInterstitial();       // естественная пауза, не активная игра
  if(was) nextWindow();
}
let modalData=null;
function actBtn(label, cls, fn){
  const b=document.createElement('button'); b.className="mbtn "+(cls||""); b.textContent=label;
  b.onclick=fn; $("mAct").appendChild(b); return b;
}
function fishThumb(sp){
  const c=document.createElement('canvas'); c.width=104; c.height=88;
  const g=c.getContext('2d'); drawFish(g,sp,52,46,1.15,1,0); return c;
}
function buildModal(kind){
  const body=$("mBody"), act=$("mAct"); const can=(cost)=>S.coins>=cost;
  act.innerHTML="";
  if(kind==='fish'){
    $("mTitle").textContent=T("fishTitle"); body.innerHTML="";
    SPECIES.forEach(sp=>{
      const owned=S.fish.includes(sp.id);
      const row=document.createElement('div'); row.className="row";
      const th=fishThumb(sp); th.className="thumb"; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      info.innerHTML='<div class="nm">'+nm(sp)+'</div><div class="ds">+'+fmtRate(sp.ips)+' '+T("ipsUnit")+'</div>';
      row.appendChild(info);
      const b=document.createElement('button');
      if(owned){ b.className="buy owned"; b.textContent=T("owned"); }
      else{ const c=fishCost(sp); b.className="buy"+(can(c)?"":" can-not");
        b.textContent=T("buy")+" · "+fmt(c);
        b.onclick=()=>{ if(buyFish(sp.id)) buildModal('fish'); }; }
      row.appendChild(b); body.appendChild(row);
    });
  } else if(kind==='up'){
    $("mTitle").textContent=T("upTitle"); body.innerHTML="";
    const hint=document.createElement('div'); hint.className="hint";
    hint.textContent=T('offLine',{n:fmt(ipsCalm()*OFF_MULT*OFF_CAP), h:OFF_CAP/3600});
    body.appendChild(hint);
    const ups=[
      {k:'feed', ic:'<circle cx="26" cy="22" r="10" fill="#FF9E5A" stroke="#233A4E" stroke-width="2.5"/><circle cx="22" cy="19" r="2" fill="#fff"/>', c:feedCost()},
      {k:'aer',  ic:'<path d="M18 30c3-4 5 2 8-2s3 3 6-1" fill="none" stroke="#5B9BD5" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="14" r="3" fill="#7FD1AE" stroke="#233A4E" stroke-width="2"/><circle cx="20" cy="12" r="2.4" fill="#7FD1AE" stroke="#233A4E" stroke-width="1.8"/>', c:aerCost()},
      {k:'plant',ic:'<path d="M26 34c-6-4-8-12-6-20 3 4 4 10 6 14 2-4 3-10 6-14 2 8 0 16-6 20z" fill="#7FD1AE" stroke="#233A4E" stroke-width="2.4" stroke-linejoin="round"/>', c:plantCost()},
    ];
    ups.forEach(u=>{
      const row=document.createElement('div'); row.className="row";
      const th=document.createElement('div'); th.className="thumb";
      th.innerHTML='<svg viewBox="0 0 52 44" width="52" height="44">'+u.ic+'</svg>'; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      const key='up'+u.k.charAt(0).toUpperCase()+u.k.slice(1);
      info.innerHTML='<div class="nm">'+T(key)+' · '+T("lvl")+(S[u.k]+1)+'</div><div class="ds">'+T(key+'D')+'</div>';
      row.appendChild(info);
      const maxed=!Number.isFinite(u.c);
      const b=document.createElement('button'); b.className="buy"+(maxed?" owned":(can(u.c)?"":" can-not"));
      b.textContent=maxed?T("max"):fmt(u.c);
      if(!maxed) b.onclick=()=>{ if(buyUp(u.k)) buildModal('up'); };
      row.appendChild(b); body.appendChild(row);
    });
  } else if(kind==='coll'){
    $("mTitle").textContent=T("collTitle")+" ("+S.seen.length+"/"+SPECIES.length+")"; body.innerHTML="";
    const left=SPECIES.length-S.seen.length;
    const h=document.createElement('div'); h.className="hint";
    h.textContent = left>0 ? T("collLeft",{n:left}) : T("collAll");
    body.appendChild(h);
    const grid=document.createElement('div'); grid.className="coll";
    SPECIES.forEach(sp=>{
      const seen=S.seen.includes(sp.id);
      const card=document.createElement('div'); card.className="card"+(seen?"":" locked");
      if(seen){
        card.appendChild(fishThumb(sp));
        const n=document.createElement('div'); n.className="cn"; n.textContent=nm(sp); card.appendChild(n);
      } else {
        const q=document.createElement('div'); q.className="qm"; q.textContent="?"; card.appendChild(q);
        const n=document.createElement('div'); n.className="cn"; n.textContent="—"; card.appendChild(n);
      }
      grid.appendChild(card);
    });
    body.appendChild(grid);
  } else if(kind==='offline'){
    // Построчно, а не одним числом: так видна отдача от вложений в рыбок.
    const r=modalData;
    $("mTitle").textContent=T("offTitle"); body.innerHTML="";
    const head=document.createElement('div'); head.className="hint";
    head.textContent=T("offWas")+" "+humanTime(r.away)+". "+T("offWork");
    body.appendChild(head);
    S.fish.forEach(id=>{
      const sp=SP(id); if(!sp) return;
      const part=Math.floor(sp.ips*aerMult()*prestigeMult()*OFF_MULT*r.sec);
      if(part<=0) return;
      const row=document.createElement('div'); row.className="orow";
      row.innerHTML='<span class="on">'+nm(sp)+'</span><span class="ov">+'+fmt(part)+'</span>';
      body.appendChild(row);
    });
    const tot=document.createElement('div'); tot.className="orow total";
    tot.innerHTML='<span class="on">🪙</span><span class="ov">+'+fmt(r.amount)+'</span>';
    body.appendChild(tot);
    if(r.capped){
      const c=document.createElement('div'); c.className="hint warn";
      c.textContent=T('offCap',{h:OFF_CAP/3600}); body.appendChild(c);
    }
    actBtn(T('offTake'), "", closeModal);
    if(r.amount>0) actBtn(T('offX2')+" ▶", "main", ()=>{
      showRewarded(()=>{ const g=earn(r.amount); refreshHud(); persist(true); sfx("coin");
        toast("+"+fmt(g)); closeModal(); });
    });
  } else if(kind==='daily'){
    const i=dailyIndex();
    $("mTitle").textContent=T("dayTitle"); body.innerHTML="";
    const st=document.createElement('div'); st.className="hint";
    st.textContent=T('dayStreak',{n:(S.dailyDay===dayStr(Date.now()-86400000)?S.streak:0)+1});
    body.appendChild(st);
    const grid=document.createElement('div'); grid.className="days";
    for(let d=0; d<7; d++){
      const r=dayReward(d);
      const cell=document.createElement('div');
      cell.className="dcell"+(d<i?" done":"")+(d===i?" now":"");
      cell.innerHTML='<div class="dn">'+T('dayN',{n:d+1})+'</div>'
        +'<div class="dv">'+(r.corals?('+'+r.corals+' 🪸'):('+'+fmt(r.coins)))+'</div>';
      grid.appendChild(cell);
    }
    body.appendChild(grid);
    actBtn(T('offTake'), "", ()=>claimDaily(false));
    actBtn(T('offX2')+" ▶", "main", ()=>claimDaily(true));
  } else if(kind==='prestige'){
    const got=coralsPending();
    $("mTitle").textContent=T("presTitle"); body.innerHTML="";
    const w=document.createElement('div'); w.className="hint"; w.textContent=T("presWhat"); body.appendChild(w);
    const g=document.createElement('div'); g.className="orow total";
    g.innerHTML='<span class="on">'+T('presGet',{n:got})+'</span>'; body.appendChild(g);
    const m=document.createElement('div'); m.className="hint";
    m.textContent=T('presNow',{n:prestigeMult().toFixed(2)})+" → "+T('presAfter',{n:(1+CORAL_MULT*(S.corals+got)).toFixed(2)});
    body.appendChild(m);
    const l=document.createElement('div'); l.className="hint warn"; l.textContent=T("presLose"); body.appendChild(l);
    if(prestigeReady()) actBtn(T('presDo'), "main", doPrestige);
    else { const p=document.createElement('div'); p.className="hint"; p.textContent=T("presSoon"); body.appendChild(p); }
  } else if(kind==='shortcut'){
    $("mTitle").textContent=T("scTitle"); body.innerHTML="";
    const w=document.createElement('div'); w.className="hint"; w.textContent=T("scWhat"); body.appendChild(w);
    actBtn(T('scNo'), "", ()=>{ S.flags.scAsked=true; persist(true); closeModal(); });
    actBtn(T('scAdd'), "main", askShortcut);
  }
}

// ---------- Очередь окон: возвращение → ежедневка → подсказки ----------
let pendingOffline=null;
function nextWindow(){
  if(modalOpen) return;
  if(pendingOffline){ const r=pendingOffline; pendingOffline=null; openModal('offline', r); return; }
  if(dailyPending() && (S.fish.length>1 || S.lifetime>0)){ openModal('daily'); return; }
  maybeOfferShortcut();                          // последним: он не срочный
}

// ---------- Контекстные подсказки ----------
// Отдельная от обучения система: триггеры условные, а не последовательные,
// и показываются в том числе давним игрокам, которые линейный туториал
// никогда не пройдут заново.
const TIPS = [
  { id:'x2',   target:'x2Btn',    side:false,
    text:()=>T('tipX2'),
    when:()=> S.lifetime>0 && S.fish.length>=2 && !x2On() && !S.flags.usedX2 },
  { id:'off',  target:'ipsChip',  side:false,
    text:()=>T('tipOff'),
    when:()=> S.fish.length>=2 && ipsCalm()>0 && !S.flags.sawOffline },
  { id:'goal', target:'goalBar',  side:false,
    text:()=>T('tipGoal'),
    when:()=> goalReady() && S.goal===0 },
  { id:'pres', target:'presBtn',  side:true,
    text:()=>T('tipPres'),
    when:()=> prestigeReady() && S.resets===0 },
];
let tipNow=null, tipT=0;
function showTip(tip){
  const el=$("tip"), tg=$(tip.target);
  if(!tg) return;
  tipNow=tip; el.textContent=tip.text();
  el.classList.toggle("side", !!tip.side);
  const r=tg.getBoundingClientRect();
  if(tip.side){ el.style.left=(r.left-10)+"px"; el.style.top=(r.top+r.height/2)+"px"; }
  else { el.style.left=Math.max(125, Math.min(innerWidth-125, r.left+r.width/2))+"px";
         el.style.top=(r.top-12)+"px"; }
  el.classList.add("on"); tg.classList.add("tipTarget");
  clearTimeout(tipT); tipT=setTimeout(closeTip, 11000);       // висящая насовсем хуже, чем никакой
}
function closeTip(){
  if(!tipNow) return;
  const tg=$(tipNow.target); if(tg) tg.classList.remove("tipTarget");
  S.tips[tipNow.id]=true; tipNow=null; $("tip").classList.remove("on");
  clearTimeout(tipT); persist(true);
}
function tipTick(){
  if(tipNow || !booted || modalOpen) return;                  // никогда поверх окна
  const tip=TIPS.find(x=> !S.tips[x.id] && x.when());
  if(tip) showTip(tip);
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, sandY=0;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let INK="#233A4E", PAPER="#FBF6E9";
let bgCan=null;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  sandY=H*0.84;
  INK=cssVar("--ink")||INK; PAPER=cssVar("--paper")||PAPER;
  buildScenery(); buildBg();
}
addEventListener("resize",resize);

// ---------- Живой мир: декор, пузыри, водоросли, медуза, краб ----------
let weeds=[], bubbles=[], rocks=[], shells=[], jelly=null, crab=null;
function rr(a,b){ return a+(b-a)*Math.random(); }
function buildScenery(){
  weeds=[]; const n=Math.max(4, Math.round(W/95));
  for(let i=0;i<n;i++) weeds.push({ x:rr(20,W-20), h:rr(H*0.10,H*0.22), w:rr(7,12),
    hue:i%2?'#4FA98A':'#6FC3A0', ph:rr(0,6.28), seg:5 });
  bubbles=[]; for(let i=0;i<26;i++) bubbles.push({ x:rr(0,W), y:rr(0,H), r:rr(2,5.5), sp:rr(14,34), dr:rr(-8,8) });
  rocks=[]; const rn=Math.max(3,Math.round(W/220));
  for(let i=0;i<rn;i++){ const rw=rr(46,90); rocks.push({ x:rr(rw,W-rw), rw:rw, rh:rr(20,34), tone:i%2?'#3B5566':'#47657A' }); }
  shells=[]; for(let i=0;i<Math.max(3,Math.round(W/260));i++) shells.push({ x:rr(30,W-30), s:rr(9,15), t:Math.random()<0.5?'shell':'star', hue:Math.random()<0.5?'#F2C14E':'#E88BA0' });
  jelly={ x:rr(0,W), y:rr(H*0.28,H*0.5), dir:Math.random()<0.5?1:-1, sp:rr(9,16), ph:0 };
  crab={ x:rr(60,W-60), dir:Math.random()<0.5?1:-1, sp:rr(10,18), ph:0 };
}
function buildBg(){
  bgCan=document.createElement('canvas'); bgCan.width=Math.max(1,W*DPR); bgCan.height=Math.max(1,H*DPR);
  const g=bgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  // вода — вертикальный градиент (светлее сверху, глубокая синь снизу)
  const wg=g.createLinearGradient(0,0,0,H);
  wg.addColorStop(0,'#7FCBDD'); wg.addColorStop(0.35,'#3E96BC'); wg.addColorStop(0.7,'#256E96'); wg.addColorStop(1,'#123E5E');
  g.fillStyle=wg; g.fillRect(0,0,W,H);
  // мягкое солнечное свечение сверху
  const sun=g.createRadialGradient(W*0.7,-H*0.1,10,W*0.7,-H*0.1,H*0.75);
  sun.addColorStop(0,'rgba(255,255,245,.35)'); sun.addColorStop(1,'rgba(255,255,245,0)');
  g.fillStyle=sun; g.fillRect(0,0,W,H);
  // задний план — тёмная толща у дна
  const dg=g.createLinearGradient(0,sandY-70,0,sandY);
  dg.addColorStop(0,'rgba(10,40,60,0)'); dg.addColorStop(1,'rgba(10,40,60,.35)');
  g.fillStyle=dg; g.fillRect(0,sandY-70,W,70);
  // камни на дне
  rocks.forEach(r=>{ g.fillStyle=r.tone; g.strokeStyle=INK; g.lineWidth=3;
    g.beginPath(); g.ellipse(r.x, sandY-2, r.rw, r.rh, 0, Math.PI, 0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle='rgba(255,255,255,.10)'; g.beginPath(); g.ellipse(r.x-r.rw*0.3, sandY-r.rh*0.6, r.rw*0.4, r.rh*0.4,0,0,6.28); g.fill(); });
  // песчаное дно — тёплая волнистая насыпь с чернильным верхним контуром
  g.beginPath(); g.moveTo(0,H); g.lineTo(0,sandY);
  for(let x=0;x<=W;x+=40){ const y=sandY + Math.sin(x*0.03)*6; g.lineTo(x,y); }
  g.lineTo(W,H); g.closePath();
  const sg=g.createLinearGradient(0,sandY-10,0,H); sg.addColorStop(0,'#EAD7A6'); sg.addColorStop(1,'#CDA86E');
  g.fillStyle=sg; g.fill();
  g.strokeStyle=INK; g.lineWidth=3.5; g.beginPath();
  for(let x=0;x<=W;x+=40){ const y=sandY + Math.sin(x*0.03)*6; x===0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke();
  // ракушки/морские звёзды на песке
  shells.forEach(sh=>{ g.save(); g.translate(sh.x, sandY+8); g.strokeStyle=INK; g.lineWidth=2; g.fillStyle=sh.hue;
    if(sh.t==='star'){ g.beginPath(); for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2, rad=i%2?sh.s*0.45:sh.s; const px=Math.cos(a)*rad, py=Math.sin(a)*rad*0.7; i?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); g.fill(); g.stroke(); }
    else { g.beginPath(); g.arc(0,0,sh.s,Math.PI,0); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); for(let k=-2;k<=2;k++){ g.moveTo(0,0); g.lineTo(Math.sin(k*0.5)*sh.s*0.9,-Math.cos(k*0.5)*sh.s*0.9);} g.stroke(); }
    g.restore(); });
  // тонкая внутренняя рамка «стекла аквариума»
  g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6);
}
function drawBackground(){ if(bgCan) ctx.drawImage(bgCan,0,0,W,H); }

// лучи света (мерцают), водоросли (колышутся), пузыри, медуза, краб
function drawRays(t){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const x=W*(0.2+0.3*i), a=0.05+0.035*Math.sin(t*0.6+i);
    ctx.fillStyle='rgba(255,255,240,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+70,0); ctx.lineTo(x+170,H); ctx.lineTo(x+40,H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawWeeds(t){
  weeds.forEach(w=>{
    ctx.strokeStyle=w.hue; ctx.lineWidth=w.w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(w.x, sandY);
    let px=w.x, py=sandY;
    for(let s=1;s<=w.seg;s++){
      const yy=sandY - (w.h/w.seg)*s;
      const xx=w.x + Math.sin(t*1.1 + w.ph + s*0.6)*(6+s*2.2);
      ctx.quadraticCurveTo((px+xx)/2, (py+yy)/2, xx, yy); px=xx; py=yy;
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(20,50,40,.25)'; ctx.lineWidth=2;
    ctx.stroke();
  });
}
function drawBubbles(t,dt){
  ctx.lineWidth=1.5;
  bubbles.forEach(b=>{
    b.y-=b.sp*dt; b.x+=Math.sin(t*2+b.y*0.05)*b.dr*dt;
    if(b.y< -10){ b.y=H+rr(0,40); b.x=rr(0,W); }
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28);
    ctx.fillStyle='rgba(230,248,255,.30)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.3,0,6.28); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
  });
}
function drawJelly(t,dt){
  const j=jelly; j.x+=j.dir*j.sp*dt; j.ph=t;
  if(j.x>W+50) j.dir=-1; if(j.x< -50) j.dir=1;
  const y=j.y + Math.sin(t*0.9)*10, bell=26, sq=1+0.08*Math.sin(t*2);
  ctx.save(); ctx.translate(j.x,y);
  // щупальца
  ctx.strokeStyle='rgba(200,160,220,.75)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(i*5, bell*0.5);
    ctx.quadraticCurveTo(i*5+Math.sin(t*3+i)*6, bell*1.3, i*5+Math.sin(t*3+i)*10, bell*2.1); ctx.stroke(); }
  // купол
  ctx.beginPath(); ctx.ellipse(0,0,bell*sq,bell*0.8/sq,0,Math.PI,0); ctx.closePath();
  ctx.fillStyle='rgba(190,150,225,.55)'; ctx.fill();
  ctx.strokeStyle='rgba(120,80,150,.6)'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();
}
function drawCrab(t,dt){
  const c=crab; c.x+=c.dir*c.sp*dt; if(c.x>W-40) c.dir=-1; if(c.x<40) c.dir=1;
  const y=sandY+6+Math.abs(Math.sin(t*6))*2;
  ctx.save(); ctx.translate(c.x,y); ctx.scale(c.dir,1);
  ctx.fillStyle='#E06A4C'; ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineCap='round';
  // лапки
  for(let i=-1;i<=1;i++){ ctx.strokeStyle=INK; ctx.beginPath(); ctx.moveTo(i*7,3); ctx.lineTo(i*10-6,10+Math.sin(t*6+i)*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i*7,3); ctx.lineTo(i*10+6,10+Math.cos(t*6+i)*2); ctx.stroke(); }
  // клешни
  ctx.fillStyle='#E06A4C'; ctx.strokeStyle=INK;
  ctx.beginPath(); ctx.arc(-16,-1,5,0,6.28); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(16,-1,5,0,6.28); ctx.fill(); ctx.stroke();
  // тело
  ctx.beginPath(); ctx.ellipse(0,0,14,9,0,0,6.28); ctx.fill(); ctx.stroke();
  // глазки
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-7,2.6,0,6.28); ctx.arc(4,-7,2.6,0,6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(-4,-7,1.1,0,6.28); ctx.arc(4,-7,1.1,0,6.28); ctx.fill();
  ctx.restore();
}

// ---------- Рыбки (векторные модельки) ----------
let swimmers=[];
function spawnSwimmer(sp){ swimmers.push({ sp, x:rr(W*0.2,W*0.8), y:rr(H*0.28,sandY-40),
  vx:rr(-1,1)<0?-1:1, tvy:0, dir:Math.random()<0.5?1:-1, spd:rr(26,44), phase:rr(0,6.28), target:null, eat:0 }); }
function rebuildSwimmers(){ swimmers=[]; S.fish.forEach(id=>spawnSwimmer(SP(id))); }

let food=[];   // хлопья корма (визуально тонут; монеты уже начислены при тапе)
function spawnFood(x){ const fx=(x==null)?rr(W*0.2,W*0.8):x; for(let i=0;i<3;i++) food.push({ x:fx+rr(-16,16), y:rr(60,90), vy:rr(18,30), life:1 }); ripple.push({x:fx,y:70,r:4,life:1}); }
let ripple=[];

function updateWorld(t,dt){
  // корм тонет
  for(let i=food.length-1;i>=0;i--){ const f=food[i]; f.y+=f.vy*dt; if(f.y>sandY-6){ f.life-=dt*1.5; if(f.life<=0) food.splice(i,1); } }
  // рыбки плавают + идут к ближайшему корму
  swimmers.forEach(s=>{
    s.phase+=dt*6;
    let tx=null,ty=null,best=1e9;
    if(food.length){ food.forEach(f=>{ const d=(f.x-s.x)**2+(f.y-s.y)**2; if(d<best){best=d; tx=f.x; ty=f.y;} }); }
    if(tx!=null && best<340*340){ // плывёт к корму
      const dx=tx-s.x, dy=ty-s.y, L=Math.hypot(dx,dy)||1;
      s.x+=dx/L*s.spd*1.6*dt; s.y+=dy/L*s.spd*1.6*dt; s.dir=dx<0?-1:1;
      if(L<16){ for(let i=food.length-1;i>=0;i--){ if(Math.abs(food[i].x-tx)<1&&Math.abs(food[i].y-ty)<1){ food.splice(i,1); break; } } s.eat=1; sparkle(s.x,s.y); }
    } else { // спокойное блуждание
      s.x+=s.dir*s.spd*dt*0.5;
      s.y+=Math.sin(t*1.3+s.phase)*8*dt;
      if(s.x>W*0.9){ s.dir=-1; } if(s.x<W*0.1){ s.dir=1; }
      s.y=Math.max(H*0.24, Math.min(sandY-34, s.y));
    }
    if(s.eat>0) s.eat=Math.max(0,s.eat-dt*2);
  });
  for(let i=ripple.length-1;i>=0;i--){ const r=ripple[i]; r.r+=40*dt; r.life-=dt*2; if(r.life<=0) ripple.splice(i,1); }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.y-=20*dt; s.life-=dt*1.6; if(s.life<=0) sparks.splice(i,1); }
}
let sparks=[];
function sparkle(x,y){ for(let i=0;i<4;i++) sparks.push({x:x+rr(-8,8),y:y+rr(-8,8),life:1}); }

// универсальная отрисовка рыбки: g — контекст, sp — вид, (cx,cy) центр, scale, dir, wag[-1..1]
function drawFish(g, sp, cx, cy, scale, dir, wag){
  g.save(); g.translate(cx,cy); g.scale(dir*scale, scale);
  const ink=INK; g.lineJoin='round';
  const bw = sp.shape==='cat'?30 : sp.shape==='puffer'?21 : sp.shape==='angel'?18 : 22;
  const bh = sp.shape==='cat'?14 : sp.shape==='puffer'?21 : sp.shape==='tang'?21 : sp.shape==='angel'?24 : 15;
  // хвост (машет)
  g.save(); g.translate(-bw+3,0); g.rotate(wag*0.35);
  g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=3;
  const tl = sp.shape==='gold'? 20 : 13, th = sp.shape==='gold'? 16 : 12;
  g.beginPath(); g.moveTo(0,0); g.lineTo(-tl,-th); g.quadraticCurveTo(-tl*0.6,0,-tl,th); g.closePath(); g.fill(); g.stroke();
  g.restore();
  // спинной плавник
  g.fillStyle=sp.c2; g.strokeStyle=ink; g.lineWidth=3;
  if(sp.shape==='angel'){ g.beginPath(); g.moveTo(-4,-bh); g.lineTo(6,-bh-10); g.lineTo(10,-4); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(-4,bh); g.lineTo(6,bh+10); g.lineTo(10,4); g.closePath(); g.fill(); g.stroke(); }
  else { g.beginPath(); g.moveTo(-6,-bh+2); g.quadraticCurveTo(2,-bh-8,10,-bh+3); g.closePath(); g.fill(); g.stroke(); }
  // тело
  g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=3.2;
  g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill();
  // шипы иглобрюха
  if(sp.shape==='puffer'){ g.save(); g.strokeStyle=ink; g.lineWidth=2.4; for(let a=0;a<12;a++){ const an=a/12*6.28; g.beginPath(); g.moveTo(Math.cos(an)*bw*0.85,Math.sin(an)*bh*0.85); g.lineTo(Math.cos(an)*(bw+6),Math.sin(an)*(bh+6)); g.stroke(); } g.restore(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); }
  g.stroke();
  // светлое брюшко
  g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip();
  g.fillStyle='rgba(255,255,255,.32)'; g.beginPath(); g.ellipse(2,bh*0.45,bw*0.9,bh*0.55,0,0,6.28); g.fill();
  // узоры по видам
  if(sp.shape==='clown'){ g.fillStyle=sp.c2; g.strokeStyle=ink; g.lineWidth=2.4;
    [-6,6].forEach(px=>{ g.beginPath(); g.ellipse(px,0,3.4,bh,0,0,6.28); g.fill(); g.stroke(); }); }
  if(sp.shape==='neon'){ g.fillStyle='#2FE0E0'; g.fillRect(-bw,-2.5,bw*2,3.2); g.fillStyle=sp.c2; g.fillRect(-2,0,bw,3); }
  if(sp.shape==='tang'){ g.fillStyle='rgba(20,40,70,.35)'; g.beginPath(); g.moveTo(4,-bh); g.quadraticCurveTo(-10,0,4,bh); g.lineTo(-2,bh); g.quadraticCurveTo(-16,0,-2,-bh); g.closePath(); g.fill(); }
  if(sp.shape==='gold'){ g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.arc(-4,-3,bw*0.6,0,6.28); g.fill(); }
  g.restore();
  // грудной плавник
  g.fillStyle=sp.c2; g.strokeStyle=ink; g.lineWidth=2.6;
  g.save(); g.translate(2,3); g.rotate(0.2+wag*0.15);
  g.beginPath(); g.ellipse(0,0,7,4,0,0,6.28); g.fill(); g.stroke(); g.restore();
  // усики сомика
  if(sp.shape==='cat'){ g.strokeStyle=ink; g.lineWidth=2; g.lineCap='round';
    g.beginPath(); g.moveTo(bw-2,4); g.quadraticCurveTo(bw+8,8,bw+12,5); g.stroke();
    g.beginPath(); g.moveTo(bw-2,6); g.quadraticCurveTo(bw+8,12,bw+14,10); g.stroke(); }
  // глаз
  const ex=bw*0.55;
  g.fillStyle='#fff'; g.strokeStyle=ink; g.lineWidth=2;
  g.beginPath(); g.arc(ex,-bh*0.25,4.2,0,6.28); g.fill(); g.stroke();
  g.fillStyle=ink; g.beginPath(); g.arc(ex+1,-bh*0.25,2,0,6.28); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(ex+0.2,-bh*0.25-0.8,0.8,0,6.28); g.fill();
  // ротик
  g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1,bh*0.12,2.4,-0.5,0.9); g.stroke();
  g.restore();
}
function drawSwimmers(t){
  swimmers.forEach(s=>{
    const wag=Math.sin(s.phase);
    const sc=0.9+(s.eat>0?0.06*Math.sin(t*30):0);
    drawFish(ctx, s.sp, s.x, s.y, sc, s.dir, wag);
    // именная плашка над рыбкой (бумажный чип + чернильный контур)
    const label=nm(s.sp);
    ctx.font='800 12px Nunito, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const wpx=ctx.measureText(label).width+16, ny=s.y-30;
    ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=2;
    roundRect(ctx, s.x-wpx/2, ny-10, wpx, 20, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; ctx.fillText(label, s.x, ny);
  });
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawFood(){
  ctx.fillStyle='#C98A3E'; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
  food.forEach(f=>{ ctx.globalAlpha=Math.max(0,f.life); ctx.beginPath(); ctx.arc(f.x,f.y,2.6,0,6.28); ctx.fill(); ctx.stroke(); ctx.globalAlpha=1; });
  ripple.forEach(r=>{ ctx.globalAlpha=Math.max(0,r.life)*0.6; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.28); ctx.stroke(); ctx.globalAlpha=1; });
  sparks.forEach(s=>{ ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle='#F7EAB0'; ctx.beginPath(); ctx.arc(s.x,s.y,2.2,0,6.28); ctx.fill(); ctx.globalAlpha=1; });
}

// ---------- Главный цикл ----------
let lastT=performance.now(), acc=0, tSec=0;
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now; tSec+=dt;
  acc+=dt;
  if(acc>=1){
    const t=Math.floor(acc); acc-=t;
    const r=ips();
    if(r>0){ earn(r*t); refreshHud(); persist(); }
    S.time=Date.now();          // отметка времени для офлайн-досчёта
  }
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawRays(tSec);
  drawWeeds(tSec);
  drawJelly(tSec,dt);
  updateWorld(tSec,dt);
  drawSwimmers(tSec);
  drawFood();
  drawBubbles(tSec,dt);
  drawCrab(tSec,dt);
  requestAnimationFrame(frame);
}

// ---------- Boot ----------
let readySent=false;
function sendReady(){
  if(readySent) return; readySent=true;
  try{ if(ysdk && ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready(); }catch(e){}
}
function boot(raw){
  if(booted) return; booted=true;
  readPlatformLang();                     // до первой отрисовки интерфейса
  restore(raw);
  resize(); rebuildSwimmers();
  // Офлайн-досчёт: формулой, потому что в игре нет ограничений (склад, очередь),
  // которые формула могла бы соврать. Считается до показа интерфейса.
  const away = Math.floor((Date.now() - S.time)/1000);
  if(away >= OFF_MIN){
    const r = applyOffline(away);
    if(r.amount>0 && away >= OFF_REPORT) pendingOffline = r;
    else if(r.amount>0) setTimeout(()=>toast("+"+fmt(r.amount)), 600);
  }
  refreshHud();
  $("tapBtn").onclick   = ()=>doFeed();
  $("giftBtn").onclick  = claimGift;
  $("x2Btn").onclick    = claimX2;
  $("fishBtn").onclick  = ()=>openModal('fish');
  $("upBtn").onclick    = ()=>openModal('up');
  $("collBtn").onclick  = ()=>openModal('coll');
  $("presBtn").onclick  = ()=>openModal('prestige');
  $("goalBar").onclick  = claimGoal;
  $("mClose").onclick   = closeModal;
  $("modal").addEventListener('pointerdown', e=>{ if(e.target.id==='modal') closeModal(); });
  // тап по воде = кормление в точке касания
  cv.addEventListener('pointerdown', e=>{ if(modalOpen) return; doFeed(e.clientX); });
  // любое действие игрока снимает подсказку: она уже сделала своё дело
  document.addEventListener('pointerdown', ()=>{ if(tipNow) closeTip(); }, true);
  // дожим сейва при уходе со страницы + пауза звука в фоне (звук — в sfx.js)
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ saveNow(); }
    else {
      const gap=Math.floor((Date.now()-S.time)/1000);
      if(gap>=OFF_MIN){ const r=applyOffline(gap);
        if(r.amount>0){ refreshHud(); persist(true);
          if(gap>=OFF_REPORT && !modalOpen) openModal('offline', r); else toast("+"+fmt(r.amount)); } }
      S.time=Date.now();
    }
  });
  addEventListener('pagehide', saveNow);
  startMusic();
  bootedAt=Date.now();
  submitScore(S.best);
  setInterval(()=>{ refreshHud(); tipTick(); }, 1000);
  requestAnimationFrame(frame);
  // Сигнал готовности — до того, как игра станет доступна для действий,
  // ровно один раз и на всех путях запуска.
  sendReady();
  document.body.classList.add('ready');
  nextWindow();
}
(function initSDK(){

  function start(){
