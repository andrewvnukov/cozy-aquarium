<style>
  :root{
    /* ── Токены под тему «подводный аквариум» (бумажный HUD + чернильный контур серии) ── */
    --ink:#233A4E; --ink-soft:#6E8A9C; --line:#2B4358;
    --paper:#FBF6E9;
    --accent:#FF9E5A; --accent-deep:#E87A38;
    --gold:#F2C14E; --mint:#7FD1AE; --lav:#B9A3E3; --sky:#5B9BD5;
    --bg:#2C7FA6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(35,58,78,.28)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(35,58,78,.28);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .rbtn svg{width:27px;height:27px;display:block}
  .rbtn.lang{font-family:'Nunito',system-ui,sans-serif;font-weight:900;font-size:14px;letter-spacing:.5px;color:var(--ink)}
  .bottom{display:flex;gap:6px;pointer-events:auto}
  .abtn{flex:1;min-width:0;background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:9px 4px;
        font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 rgba(35,58,78,.28);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .abtn .bt{font-size:12.5px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .abtn .bs{font-size:10.5px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  .abtn.main{background:var(--accent);border-color:var(--accent-deep)}
  .abtn.blue{background:var(--sky);border-color:#3E77AD}
  .abtn.lav{background:var(--lav);border-color:#8E76C0}
  .abtn.buyfish{background:var(--mint);border-color:#5FB893;color:#173F31}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── модалка (магазин/апгрейды/коллекция) ── */
  #modal{position:absolute;inset:0;background:rgba(20,40,58,.55);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:5;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBF1DA);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(20,40,58,.3)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(35,58,78,.28)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(35,58,78,.28)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(35,58,78,.18)}
  .row .thumb{width:52px;height:44px;flex:none;background:#EAF4F7;border:2px solid var(--line);border-radius:11px}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(35,58,78,.25);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5FB893}
.hint{background:#EAF4F7;border:2px dashed var(--line);border-radius:12px;padding:9px 11px;
        font-weight:800;font-size:12.5px;color:var(--ink);margin-bottom:10px;line-height:1.25}
  .hint.alt{background:#FFF3DF;border-style:solid;border-color:#E3C48A}
  .row.locked{opacity:.6}
  .row.locked .thumb{filter:grayscale(1) brightness(1.15)}
  .lockico{font-size:20px;flex:none;padding:0 8px}
  .buy.wide{width:100%;margin-top:4px;padding:12px;font-size:15px}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(35,58,78,.18)}
  .card canvas{width:78px;height:56px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:12px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:56px;line-height:56px}
  /* карточка обучения над нижними кнопками; тапы проходят сквозь неё */
  #tut{position:absolute;left:50%;transform:translateX(-50%);bottom:154px;z-index:4;pointer-events:none;max-width:92%}
  #tut.hidden{display:none}
  #tutCard{background:var(--paper);border:2.5px solid var(--line);border-radius:14px;padding:10px 36px 10px 13px;
           font-weight:800;font-size:13.5px;color:var(--ink);box-shadow:0 3px 0 rgba(35,58,78,.28);position:relative}
  #tutSkip{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
           background:#fff;font-weight:900;color:var(--ink);pointer-events:auto;cursor:pointer;font-size:12px;line-height:1;padding:0}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
'use strict';
// ============================================================
//  Тёплый Аквариум / Cozy Aquarium — idle-коллекционер про уютный аквариум
//  Петля: покормить (тап-доход) -> накопить жемчуг -> завести новую рыбку
//  (плавает, даёт пассивный доход) -> апгрейды. Живой подводный мир.
// ============================================================
const SAVE_KEY = "cozy_aquarium_v1";        // GAME: уникальный ключ сейва
const LB_NAME  = "species";                  // техимя лидерборда (рекорд = число видов)
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n (авто-язык через SDK, урок модерации п.2.14) ----------
function lang(){
  try{ if(S && (S.lang==="ru"||S.lang==="en")) return S.lang; }catch(e){} // ручной выбор игрока
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang)
    return ysdk.environment.i18n.lang==="ru"?"ru":"en"; }catch(e){}
  return (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
}
function toggleLang(){
  S.lang = lang()==="ru" ? "en" : "ru";
  document.documentElement.setAttribute("lang", S.lang);
  refreshHud(); persist(true); sfx("tap");
}
const STR = {
  coins:{ru:"ЖЕМЧУГ",en:"PEARLS"}, income:{ru:"ДОХОД",en:"INCOME"},
  feed:{ru:"Покормить",en:"Feed"}, buy:{ru:"Купить",en:"Buy fry"},
  multi:{ru:"Мульти-тап",en:"Multi-tap"}, multiOn:{ru:"Мульти идёт",en:"Multi on"},
  multiGot:{ru:"Мульти-тап на 2 минуты: тапай где угодно!",en:"Multi-tap for 2 minutes: tap anywhere!"},
  tut1:{ru:"1/3 · Тапай по рыбке — она принесёт жемчуг",en:"1/3 · Tap a fish — it brings you pearls"},
  tut2:{ru:"2/3 · Купи малька — он подрастёт за пару секунд",en:"2/3 · Buy a fry — it grows up in seconds"},
  tut3:{ru:"3/3 · Перетащи рыбку на такую же — они объединятся",en:"3/3 · Drag a fish onto a matching one to merge"},
  tutDone:{ru:"Обучение пройдено!",en:"Tutorial complete!"},
  x2:{ru:"Доход ×2",en:"Income ×2"}, x2on:{ru:"×2 идёт",en:"×2 active"},
  need:{ru:"Не хватает жемчуга",en:"Not enough pearls"},
  fishTitle:{ru:"Рыбки аквариума",en:"Your aquarium"},
  upTitle:{ru:"Улучшения аквариума",en:"Aquarium upgrades"},
  collTitle:{ru:"Коллекция рыб",en:"Fish collection"},
  lvl:{ru:"Ур.",en:"Lv."}, growing:{ru:"растут",en:"growing"}, adult:{ru:"взрослых",en:"adult"},
  perTap:{ru:"за тап",en:"per tap"},
  newFry:{ru:"Малёк поселился в аквариуме",en:"A fry joined your tank"},
  locked:{ru:"Этот вид ещё не открыт — получи его слиянием",en:"Species not unlocked yet — merge to reveal it"},
  inTank:{ru:"в аквариуме",en:"in tank"},
  shopHint:{ru:"Покупать можно любой уже открытый вид. Новые открываются слиянием.",
            en:"You can buy any species you have already unlocked. New ones come from merging."},
  newLevel:{ru:"Новый вид:",en:"New species:"},
  mergeHint:{ru:"Перетащи выросшую рыбку на такую же — получится рыбка выше уровнем",
             en:"Drag a grown fish onto a matching one to get a higher-level fish"},
  upFeed:{ru:"Сытный корм",en:"Rich food"}, upFeedD:{ru:"Корм насыщает сильнее",en:"Food is more filling"},
  upAer:{ru:"Аэратор",en:"Aerator"}, upAerD:{ru:"+25% к пассивному доходу",en:"+25% passive income"},
  upPlant:{ru:"Водоросли",en:"Water plants"}, upPlantD:{ru:"−5% к цене мальков",en:"−5% fry price"},
  ipsUnit:{ru:"ж/с",en:"p/s"},
  daily:{ru:"Ежедневный подарок:",en:"Daily gift:"},
  x2got:{ru:"Доход удвоен на 5 минут!",en:"Income doubled for 5 min!"},
  cooldown:{ru:"Ещё рано — подожди",en:"Not ready yet"},
};
const T = k => (STR[k]||{})[lang()] || (STR[k]||{}).ru || k;
const nm = sp => lang()==="ru"? sp.ru : sp.en;

// ---------- Уровни рыб (мерж-цепочка: две выросшие рыбы Lv N -> малёк Lv N+1) ----------
// tap — жемчуг за тап по взрослой рыбе; grow — сколько секунд растёт малёк этого уровня
const LEVELS = [
  {ru:'Гуппи',        en:'Guppy',       c1:'#F2A65A', c2:'#FFDDAF', shape:'guppy',  tap:1,     grow:5},
  {ru:'Золотая рыбка',en:'Goldfish',    c1:'#FF8C42', c2:'#FFC38A', shape:'gold',   tap:3,     grow:9},
  {ru:'Неон',         en:'Neon Tetra',  c1:'#3BA7D6', c2:'#F25C69', shape:'neon',   tap:9,     grow:15},
  {ru:'Клоун',        en:'Clownfish',   c1:'#FF7A2E', c2:'#FFFFFF', shape:'clown',  tap:26,    grow:24},
  {ru:'Моллинезия',   en:'Molly',       c1:'#4A4A57', c2:'#9AA0AC', shape:'molly',  tap:75,    grow:38},
  {ru:'Хирург',       en:'Blue Tang',   c1:'#3E7CC4', c2:'#F2C14E', shape:'tang',   tap:210,   grow:58},
  {ru:'Сомик',        en:'Catfish',     c1:'#8A7358', c2:'#CBB89B', shape:'cat',    tap:600,   grow:85},
  {ru:'Скалярия',     en:'Angelfish',   c1:'#F0E6C4', c2:'#4A6377', shape:'angel',  tap:1700,  grow:120},
  {ru:'Иглобрюх',     en:'Pufferfish',  c1:'#C7D66B', c2:'#EEF5C6', shape:'puffer', tap:4800,  grow:170},
];
const MAXLVL = LEVELS.length-1;
const LV = l => LEVELS[Math.max(0,Math.min(MAXLVL,l))];
const SP = l => LV(l); // drawFish работает с описанием уровня (поля c1/c2/shape те же)

// ---------- Состояние ----------
function fresh(){ return {
  v:2, coins:0,
  tank:[{lvl:0, g:1, sat:0}],              // рыбы аквариума: уровень, рост 0..1, сытость 0..1
  bought:1,                                 // сколько мальков куплено (растит цену)
  seen:[0],                                 // достигнутые уровни (коллекция)
  feed:0, aer:0, plant:0,                   // уровни апгрейдов
  best:1,                                   // рекорд: максимальный уровень+1 (лидерборд)
  x2Until:0, multiUntil:0, lastDaily:"",    // таймеры rewarded / ежедневки
  lang:null,                                // ручной выбор языка (null = авто)
  tut:0,                                    // шаг обучения (0..2), 3 = пройдено
  time:Date.now()
};}
let S = fresh();

// ---------- Экономика ----------
// Петля: тапай по рыбкам -> покупай мальков и корм -> корм ускоряет рост и даёт ×2
// -> перетащи выросшую рыбу на такую же, чтобы получить малька следующего уровня.
const x2On      = () => Date.now() < S.x2Until;
const multiOn   = () => Date.now() < S.multiUntil;
const MULTI_MS  = 120000;                                // мульти-тап: 2 минуты после рекламы

const SAT_FULL  = 0.75;                                  // порог «сыта» — с него идёт ×2
const SAT_DECAY = 0.004;                                 // сытость/сек: ×2 живёт ~60 c, тает ~4 мин
const EAT_CD    = 0.9;                                   // рыбка ест не чаще раза в 0.9 c
const feedFill  = () => 0.11 + 0.02*S.feed;              // один хлопик: нужно ~7 штук до ×2
const GROW_BOOST= 1.6;                                   // сытость ускоряет рост (до +60%)

const isSated   = f => f.sat >= SAT_FULL;
const grown     = f => f.g >= 1;
// доход с рыбы за тап: малёк платит долю от взрослого, сытый — вдвое
const fishTap   = f => Math.max(1, Math.round(LV(f.lvl).tap * (0.25+0.75*f.g) * (isSated(f)?2:1)));
const tapBase   = () => S.tank.reduce((a,f)=>a + LV(f.lvl).tap, 0);
const collectGain = () => S.tank.reduce((a,f)=>a + fishTap(f), 0);
const tapGain   = collectGain;                           // имя сохранено для тест-хуков
const aerMult   = () => 1 + 0.25*S.aer;
// пассив — фоновая добавка: 4% от тап-ценности взрослых рыб в секунду
const ipsBase   = () => S.tank.reduce((a,f)=>a + LV(f.lvl).tap*0.04*f.g, 0);
const ips       = () => ipsBase() * aerMult() * (x2On()?2:1);
// цена малька растёт с каждой покупкой — главный сдерживающий фактор прогресса
const priceMult = () => Math.max(0.5, 1 - 0.05*S.plant);
// цена рыбы уровня L: дороже, чем получить её мержем — покупка это ускорение, а не замена
const fishCostAt = lvl => Math.max(1, Math.floor(30 * Math.pow(3.2, lvl) * Math.pow(1.6, Math.max(0,S.bought-1)) * priceMult()));
const fishCost  = () => fishCostAt(0);
const unlocked  = lvl => S.seen.includes(lvl);   // открытые виды доступны в магазине
const foodCost  = () => Math.max(8, Math.ceil(tapBase()*2.5));
const feedCost  = () => Math.floor(150 * Math.pow(1.7, S.feed));
const aerCost   = () => Math.floor(400 * Math.pow(1.8, S.aer));
const plantCost = () => Math.floor(600 * Math.pow(1.9, S.plant));
const maxLvl    = () => S.tank.reduce((a,f)=>Math.max(a,f.lvl), 0);
// для базового тест-хука: upCost = цена следующего малька
const upCost    = () => fishCost();

// ---------- Сейвы (throttle + облако, фолбэк localStorage) ----------
function persist(force){
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  S.time=now; // для офлайн-декея сытости при следующем запуске
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}); }catch(e){} }
}
function restore(raw){
  if(!raw) return;
  try{ const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
       if(d&&typeof d==="object") S=Object.assign(fresh(),d); }catch(e){}
  // миграция со старой версии (список видов) и подчистка
  if(!Array.isArray(S.tank) || !S.tank.length){
    const n = Array.isArray(S.fish) ? S.fish.length : 1;
    S.tank = []; for(let i=0;i<Math.max(1,n);i++) S.tank.push({lvl:Math.min(i,MAXLVL), g:1, sat:0});
    S.bought = Math.max(1, n);
    delete S.fish;
  }
  S.tank = S.tank.filter(f=>f && typeof f.lvl==='number').map(f=>({
    lvl:Math.max(0,Math.min(MAXLVL, f.lvl|0)),
    g:Math.max(0,Math.min(1, typeof f.g==='number'? f.g : 1)),
    sat:Math.max(0,Math.min(1, typeof f.sat==='number'? f.sat : 0)),
  }));
  if(!S.tank.length) S.tank=[{lvl:0,g:1,sat:0}];
  if(typeof S.bought!=='number') S.bought=S.tank.length;
  if(!Array.isArray(S.seen) || !S.seen.length || typeof S.seen[0]!=='number') S.seen=[0];
  S.tank.forEach(f=>{ if(!S.seen.includes(f.lvl)) S.seen.push(f.lvl); });
  if(typeof S.multiUntil!=='number') S.multiUntil=0;
  // офлайн: сытость тает, мальки продолжают расти
  const off=Math.max(0,(Date.now()-(S.time||Date.now()))/1000);
  S.tank.forEach(f=>{
    if(f.g<1){
      const sp=(1+GROW_BOOST*Math.min(f.sat,1))/LV(f.lvl).grow;
      f.g=Math.min(1, f.g + sp*off);
    }
    f.sat=Math.max(0, f.sat-SAT_DECAY*off);
  });
  // старый сейв без обучения: опытному игроку обучение не показываем
  if(typeof S.tut!=='number') S.tut=(S.tank.length>1||S.coins>50)?3:0;
}

// ---------- Действия ----------
// Тап по конкретной рыбке (или по всем сразу, пока идёт мульти-тап)
function tapFish(sw){
  const g=fishTap(sw.f);
  S.coins+=g;
  popups.push({x:sw.x, y:sw.y-40, vy:-26, life:1, txt:'+'+fmt(g), gold:isSated(sw.f)});
  for(let i=0;i<(isSated(sw.f)?4:2);i++) sparks.push({x:sw.x+rr(-10,10), y:sw.y+rr(-8,8), life:1});
  sw.pop=1; // короткий «отклик» рыбки на тап
  return g;
}
function doCollect(px,py){
  if(!swimmers.length) return 0;
  let total=0;
  swimmers.forEach(sw=>{ total+=tapFish(sw); });
  if(px!=null) ripple.push({x:px, y:py!=null?py:120, r:6, life:1});
  if(S.tut===0 && ++tutTaps>=3) tutAdvance(1);
  refreshHud(); persist(); sfx("coin");
  return total;
}
// Тап по воде: дохода нет — только рябь и лёгкая вибрация
function waterTap(px,py){
  ripple.push({x:px, y:py, r:6, life:1});
  try{ navigator.vibrate && navigator.vibrate(18); }catch(e){}
}
// Кормление: платно; хлопья тонут, рыбки едят, растут быстрее и наедаются
function doFeed(){
  const c=foodCost();
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c;
  spawnFood(Math.min(6+S.tank.length*2, 22));
  refreshHud(); persist(true); sfx("tap");
  return true;
}
// Покупка малька выбранного уровня (доступны только уже открытые виды)
function buyFish(lvl){
  lvl=Math.max(0,Math.min(MAXLVL, lvl|0));
  if(!unlocked(lvl)){ toast(T("locked")); sfx("error"); return false; }
  const c=fishCostAt(lvl);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S.bought++;
  const f={lvl, g:0, sat:0};
  S.tank.push(f); spawnSwimmer(f);
  if(S.tut===1) tutAdvance(2);
  refreshHud(); persist(true); sfx("buy");
  toast(T("newFry"));
  return true;
}
// Слияние двух выросших рыб одного уровня -> малёк следующего уровня
function canMerge(a,b){
  return a && b && a!==b && a.f.lvl===b.f.lvl && a.f.lvl<MAXLVL && grown(a.f) && grown(b.f);
}
function mergeFish(a,b){
  if(!canMerge(a,b)) return false;
  const lvl=a.f.lvl+1;
  const nf={lvl, g:0, sat:Math.max(a.f.sat,b.f.sat)*0.5};
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  [a,b].forEach(sw=>{
    const i=S.tank.indexOf(sw.f); if(i>=0) S.tank.splice(i,1);
    const j=swimmers.indexOf(sw); if(j>=0) swimmers.splice(j,1);
  });
  S.tank.push(nf); spawnSwimmer(nf, mx, my);
  if(!S.seen.includes(lvl)){ S.seen.push(lvl); toast(T("newLevel")+" "+nm(LV(lvl))); }
  S.best=Math.max(S.best, lvl+1); submitScore(S.best);
  for(let i=0;i<18;i++) sparks.push({x:mx+rr(-24,24), y:my+rr(-20,20), life:1});
  popups.push({x:mx, y:my-46, vy:-24, life:1.4, txt:'Lv'+(lvl+1), gold:true});
  if(S.tut===2) tutAdvance(3);
  maybeInterstitial(); refreshHud(); persist(true); sfx("buy");
  return true;
}
// ---------- Награды ----------
function claimMulti(){
  if(multiOn()){ toast(T("multiOn")); return; }
  showRewarded(()=>{ S.multiUntil=Date.now()+MULTI_MS; refreshHud(); persist(true); sfx("buy");
    toast(T("multiGot")); });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{ S.x2Until=Date.now()+300000; refreshHud(); persist(true); sfx("buy");
    toast(T("x2got")); });
}
function buyUp(key){
  const map={feed:feedCost,aer:aerCost,plant:plantCost};
  const c=map[key](); if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function checkDaily(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastDaily!==today){
    S.lastDaily=today; const g=Math.max(80, Math.floor(tapBase()*20 + ips()*60));
    S.coins+=g; persist(true);
    setTimeout(()=>toast(T("daily")+" +"+fmt(g)), 700);
  }
}
// ---------- Обучение (3 шага на свежем сейве) ----------

    LEVELS.forEach((lv,lvl)=>{

      if(!open && lvl>maxLvl()+1) return;              // далёкие виды не показываем совсем

      {k:'aer',  ic:'<path d="M18 30c3-4 5 2 8-2s3 3 6-1" fill="none" stroke="#5B9BD5" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="14" r="3" fill="#7FD1AE" stroke="#233A4E" stroke-width="2"/><circle cx="20" cy="12" r="2.4" fill="#7FD1AE" stroke="#233A4E" stroke-width="1.8"/>', c:aerCost()},
      {k:'plant',ic:'<path d="M26 34c-6-4-8-12-6-20 3 4 4 10 6 14 2-4 3-10 6-14 2 8 0 16-6 20z" fill="#7FD1AE" stroke="#233A4E" stroke-width="2.4" stroke-linejoin="round"/>', c:plantCost()},
    ];
    ups.forEach(u=>{
      const row=document.createElement('div'); row.className="row";
      const th=document.createElement('div'); th.className="thumb";
      th.innerHTML='<svg viewBox="0 0 52 44" width="52" height="44">'+u.ic+'</svg>'; row.appendChild(th);
      const info=document.createElement('div'); info.className="info";
      info.innerHTML='<div class="nm">'+T('up'+u.k.charAt(0).toUpperCase()+u.k.slice(1))+' · '+T("lvl")+(S[u.k]+1)+'</div>'
        +'<div class="ds">'+T('up'+u.k.charAt(0).toUpperCase()+u.k.slice(1)+'D')+'</div>';
      row.appendChild(info);
      const b=document.createElement('button'); b.className="buy"+(can(u.c)?"":" can-not");
      b.textContent=fmt(u.c);
      b.onclick=()=>{ if(buyUp(u.k)) buildModal('up'); };
      row.appendChild(b); body.appendChild(row);
    });
  } else if(kind==='coll'){
    $("mTitle").textContent=T("collTitle")+" ("+S.seen.length+"/"+LEVELS.length+")"; body.innerHTML="";
    const grid=document.createElement('div'); grid.className="coll";

        const n=document.createElement('div'); n.className="cn"; n.textContent="—"; card.appendChild(n);
      }
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, sandY=0;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let INK="#233A4E", PAPER="#FBF6E9";
let bgCan=null;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  sandY=H*0.84;
  INK=cssVar("--ink")||INK; PAPER=cssVar("--paper")||PAPER;
  buildScenery(); buildBg();
}
addEventListener("resize",resize);

// ---------- Живой мир: декор, пузыри, водоросли, медуза, краб ----------
let weeds=[], bubbles=[], rocks=[], shells=[], corals=[], motes=[], jelly=null, crab=null;
function rr(a,b){ return a+(b-a)*Math.random(); }
function buildScenery(){
  weeds=[]; const n=Math.max(4, Math.round(W/95));
  for(let i=0;i<n;i++) weeds.push({ x:rr(20,W-20), h:rr(H*0.10,H*0.22), w:rr(7,12),
    hue:i%2?'#4FA98A':'#6FC3A0', ph:rr(0,6.28), seg:5, leafy:i%3===0 });
  bubbles=[]; for(let i=0;i<26;i++) bubbles.push({ x:rr(0,W), y:rr(0,H), r:rr(2,5.5), sp:rr(14,34), dr:rr(-8,8) });
  rocks=[]; const rn=Math.max(3,Math.round(W/220));
  for(let i=0;i<rn;i++){ const rw=rr(46,90); rocks.push({ x:rr(rw,W-rw), rw:rw, rh:rr(20,34), tone:i%2?'#3B5566':'#47657A' }); }
  shells=[]; for(let i=0;i<Math.max(3,Math.round(W/260));i++) shells.push({ x:rr(30,W-30), s:rr(9,15), t:Math.random()<0.5?'shell':'star', hue:Math.random()<0.5?'#F2C14E':'#E88BA0' });
  corals=[]; const cn=Math.max(2,Math.round(W/300));
  for(let i=0;i<cn;i++) corals.push({ x:rr(40,W-40), s:rr(22,40), t:i%2?'branch':'fan',
    hue:i%2?'#E8879C':'#F2A65A', ph:rr(0,6.28) });
  motes=[]; for(let i=0;i<Math.max(14,Math.round(W/40));i++)
    motes.push({ x:rr(0,W), y:rr(0,H*0.8), r:rr(0.8,2), sp:rr(2,7), dr:rr(2,9), ph:rr(0,6.28) });
  jelly={ x:rr(0,W), y:rr(H*0.28,H*0.5), dir:Math.random()<0.5?1:-1, sp:rr(9,16), ph:0 };
  crab={ x:rr(60,W-60), dir:Math.random()<0.5?1:-1, sp:rr(10,18), ph:0 };
}
function buildBg(){
  bgCan=document.createElement('canvas'); bgCan.width=Math.max(1,W*DPR); bgCan.height=Math.max(1,H*DPR);
  const g=bgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  // вода — вертикальный градиент (светлее сверху, глубокая синь снизу)
  const wg=g.createLinearGradient(0,0,0,H);
  wg.addColorStop(0,'#7FCBDD'); wg.addColorStop(0.35,'#3E96BC'); wg.addColorStop(0.7,'#256E96'); wg.addColorStop(1,'#123E5E');
  g.fillStyle=wg; g.fillRect(0,0,W,H);
  // мягкое солнечное свечение сверху
  const sun=g.createRadialGradient(W*0.7,-H*0.1,10,W*0.7,-H*0.1,H*0.75);
  sun.addColorStop(0,'rgba(255,255,245,.35)'); sun.addColorStop(1,'rgba(255,255,245,0)');
  g.fillStyle=sun; g.fillRect(0,0,W,H);
  // задний план — тёмная толща у дна
  const dg=g.createLinearGradient(0,sandY-70,0,sandY);
  dg.addColorStop(0,'rgba(10,40,60,0)'); dg.addColorStop(1,'rgba(10,40,60,.35)');
  g.fillStyle=dg; g.fillRect(0,sandY-70,W,70);
  // камни на дне
  rocks.forEach(r=>{ g.fillStyle=r.tone; g.strokeStyle=INK; g.lineWidth=3;
    g.beginPath(); g.ellipse(r.x, sandY-2, r.rw, r.rh, 0, Math.PI, 0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle='rgba(255,255,255,.10)'; g.beginPath(); g.ellipse(r.x-r.rw*0.3, sandY-r.rh*0.6, r.rw*0.4, r.rh*0.4,0,0,6.28); g.fill(); });
  // песчаное дно — тёплая волнистая насыпь с чернильным верхним контуром
  g.beginPath(); g.moveTo(0,H); g.lineTo(0,sandY);
  for(let x=0;x<=W;x+=40){ const y=sandY + Math.sin(x*0.03)*6; g.lineTo(x,y); }
  g.lineTo(W,H); g.closePath();
  const sg=g.createLinearGradient(0,sandY-10,0,H); sg.addColorStop(0,'#EAD7A6'); sg.addColorStop(1,'#CDA86E');
  g.fillStyle=sg; g.fill();
  g.strokeStyle=INK; g.lineWidth=3.5; g.beginPath();
  for(let x=0;x<=W;x+=40){ const y=sandY + Math.sin(x*0.03)*6; x===0?g.moveTo(x,y):g.lineTo(x,y); } g.stroke();
  // кораллы на дне (статичные, в фоновом слое)
  corals.forEach(co=>{ g.save(); g.translate(co.x,sandY+2); g.strokeStyle=INK;
    if(co.t==='branch'){ // ветвистый коралл
      g.lineCap='round'; g.strokeStyle=shade(co.hue,-0.3); g.lineWidth=7;
      const br=[[0,-co.s],[ -co.s*0.5,-co.s*0.75],[co.s*0.5,-co.s*0.8],[-co.s*0.85,-co.s*0.4],[co.s*0.85,-co.s*0.45]];
      br.forEach(b=>{ g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(b[0]*0.3,b[1]*0.6,b[0],b[1]); g.stroke(); });
      g.strokeStyle=co.hue; g.lineWidth=4.5;
      br.forEach(b=>{ g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(b[0]*0.3,b[1]*0.6,b[0],b[1]); g.stroke(); });
      g.fillStyle=shade(co.hue,0.35);
      br.forEach(b=>{ g.beginPath(); g.arc(b[0],b[1],3.2,0,6.28); g.fill(); });
    } else { // веерная горгонария
      g.fillStyle=rgbaC(co.hue,0.28); g.strokeStyle=shade(co.hue,-0.25); g.lineWidth=2;
      g.beginPath(); g.moveTo(0,0);
      g.arc(0,0,co.s,Math.PI*1.15,Math.PI*1.85); g.closePath(); g.fill(); g.stroke();
      for(let k=0;k<5;k++){ const an=Math.PI*(1.18+k*0.16);
        g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(an)*co.s,Math.sin(an)*co.s); g.stroke(); }
      g.beginPath(); g.arc(0,0,co.s*0.62,Math.PI*1.15,Math.PI*1.85); g.stroke();
      g.fillStyle=shade(co.hue,-0.2);
      g.beginPath(); g.ellipse(0,2,7,4,0,Math.PI,0); g.closePath(); g.fill(); g.stroke();
    }
    g.restore(); });
  // ракушки/морские звёзды на песке
  shells.forEach(sh=>{ g.save(); g.translate(sh.x, sandY+8); g.strokeStyle=INK; g.lineWidth=2; g.fillStyle=sh.hue;
    if(sh.t==='star'){ g.beginPath(); for(let i=0;i<10;i++){ const a=Math.PI/5*i-Math.PI/2, rad=i%2?sh.s*0.45:sh.s; const px=Math.cos(a)*rad, py=Math.sin(a)*rad*0.7; i?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); g.fill(); g.stroke(); }
    else { g.beginPath(); g.arc(0,0,sh.s,Math.PI,0); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); for(let k=-2;k<=2;k++){ g.moveTo(0,0); g.lineTo(Math.sin(k*0.5)*sh.s*0.9,-Math.cos(k*0.5)*sh.s*0.9);} g.stroke(); }
    g.restore(); });
  // тонкая внутренняя рамка «стекла аквариума»
  g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=6; g.strokeRect(3,3,W-6,H-6);
}
function drawBackground(){ if(bgCan) ctx.drawImage(bgCan,0,0,W,H); }

// лучи света (мерцают), водоросли (колышутся), пузыри, медуза, краб
function drawRays(t){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const x=W*(0.2+0.3*i), a=0.07+0.045*Math.sin(t*0.6+i);
    const rg=ctx.createLinearGradient(x,0,x+120,H);
    rg.addColorStop(0,'rgba(255,255,240,'+a.toFixed(3)+')');
    rg.addColorStop(0.7,'rgba(255,255,240,'+(a*0.35).toFixed(3)+')');
    rg.addColorStop(1,'rgba(255,255,240,0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+70,0); ctx.lineTo(x+185,H); ctx.lineTo(x+30,H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
// каустика: пятна света, бегущие по песку
function drawCaustics(t){
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(let i=0;i<6;i++){
    const px=((t*22+i*W/6)% (W+120))-60;
    const a=0.06+0.05*Math.sin(t*1.4+i*1.7);
    ctx.strokeStyle='rgba(255,255,230,'+Math.max(0,a).toFixed(3)+')';
    ctx.lineWidth=3.5;
    ctx.beginPath();
    ctx.ellipse(px, sandY+9+((i%3)*7), 26+8*Math.sin(t+i), 6, 0, 0.3, Math.PI-0.3);

  }
  ctx.restore();
}
// планктонные искорки в толще воды
function drawMotes(t,dt){
  ctx.save();
  motes.forEach(m=>{
    m.y-=m.sp*dt; m.x+=Math.sin(t*0.5+m.ph)*m.dr*dt;
    if(m.y<-5){ m.y=H*0.85; m.x=rr(0,W); }
    const a=0.1+0.1*Math.sin(t*1.8+m.ph);
    ctx.fillStyle='rgba(230,248,255,'+Math.max(0.04,a).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.28); ctx.fill();
  });
  ctx.restore();
}
function drawWeeds(t){
  weeds.forEach(w=>{
    // стебель с сужением: тёмная подложка + светлое ядро
    const pts=[[w.x,sandY]];
    for(let s=1;s<=w.seg;s++){
      const yy=sandY - (w.h/w.seg)*s;
      const xx=w.x + Math.sin(t*1.1 + w.ph + s*0.6)*(6+s*2.2);
      pts.push([xx,yy]);
    }
    for(const pass of [[shade(w.hue,-0.35),1],[w.hue,0.72],[shade(w.hue,0.25),0.4]]){
      ctx.strokeStyle=pass[0]; ctx.lineCap='round';
      for(let s=1;s<pts.length;s++){
        ctx.lineWidth=Math.max(1.5,w.w*pass[1]*(1-s/(pts.length+1.5)));
        ctx.beginPath(); ctx.moveTo(pts[s-1][0],pts[s-1][1]);
        ctx.quadraticCurveTo((pts[s-1][0]+pts[s][0])/2,(pts[s-1][1]+pts[s][1])/2,pts[s][0],pts[s][1]);
        ctx.stroke();
      }
    }
    // листики у «кустистых» водорослей
    if(w.leafy){
      ctx.fillStyle=rgbaC(w.hue,0.9); ctx.strokeStyle=shade(w.hue,-0.3); ctx.lineWidth=1.5;
      for(let s=1;s<pts.length-1;s++){
        const side=s%2?1:-1, lx=pts[s][0], ly=pts[s][1];
        const sway=Math.sin(t*1.3+w.ph+s)*2;
        ctx.save(); ctx.translate(lx,ly); ctx.rotate(side*(0.9+sway*0.08));
        ctx.beginPath(); ctx.ellipse(side*7,0,8,3.2,0,0,6.28); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }
  });
}
function drawBubbles(t,dt){
  ctx.lineWidth=1.5;
  bubbles.forEach(b=>{
    b.y-=b.sp*dt; b.x+=Math.sin(t*2+b.y*0.05)*b.dr*dt;
    if(b.y< -10){ b.y=H+rr(0,40); b.x=rr(0,W); }
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28);
    ctx.fillStyle='rgba(230,248,255,.30)'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x-b.r*0.3,b.y-b.r*0.3,b.r*0.3,0,6.28); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
  });
}
function drawJelly(t,dt){
  const j=jelly; j.x+=j.dir*j.sp*dt; j.ph=t;
  if(j.x>W+50) j.dir=-1; if(j.x< -50) j.dir=1;
  const y=j.y + Math.sin(t*0.9)*10, bell=26, sq=1+0.08*Math.sin(t*2);
  ctx.save(); ctx.translate(j.x,y);
  // мягкое сияние вокруг
  const gl=ctx.createRadialGradient(0,0,bell*0.2,0,0,bell*1.7);
  gl.addColorStop(0,'rgba(210,170,240,0.22)'); gl.addColorStop(1,'rgba(210,170,240,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,bell*1.7,0,6.28); ctx.fill();
  // щупальца: длинные волнистые + короткие ротовые
  ctx.lineCap='round';
  for(let i=-3;i<=3;i++){
    ctx.strokeStyle='rgba(200,160,220,'+(0.5+0.25*((i+3)%2)).toFixed(2)+')';
    ctx.lineWidth=i%2?2:3;
    ctx.beginPath(); ctx.moveTo(i*5, bell*0.5);
    ctx.quadraticCurveTo(i*5+Math.sin(t*3+i)*6, bell*1.3, i*5+Math.sin(t*3+i)*10, bell*(2.0+0.2*(i%2)));
    ctx.stroke();
  }
  ctx.strokeStyle='rgba(235,205,250,0.8)'; ctx.lineWidth=3.4;
  for(const i of [-1,1]){ ctx.beginPath(); ctx.moveTo(i*4,bell*0.45);
    ctx.quadraticCurveTo(i*4+Math.sin(t*2.4+i)*5, bell*0.95, i*7+Math.sin(t*2.4+i)*7, bell*1.35); ctx.stroke(); }
  // купол: полупрозрачный градиент с бликом и фестонами по краю
  const dg2=ctx.createRadialGradient(-bell*0.3,-bell*0.45,2,0,-bell*0.1,bell*1.15);
  dg2.addColorStop(0,'rgba(240,220,255,0.85)'); dg2.addColorStop(0.55,'rgba(190,150,225,0.6)');
  dg2.addColorStop(1,'rgba(150,105,190,0.5)');
  ctx.beginPath(); ctx.ellipse(0,0,bell*sq,bell*0.8/sq,0,Math.PI,0);
  for(const k of [1,2,3,4]) ctx.arc(bell*sq - k*bell*sq*0.5 + bell*sq*0.25, 0, bell*sq*0.25, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle=dg2; ctx.fill();
  ctx.strokeStyle='rgba(120,80,150,.65)'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(-bell*0.35,-bell*0.38,bell*0.28,bell*0.13,-0.5,0,6.28); ctx.fill();
  ctx.restore();
}
function drawCrab(t,dt){
  const c=crab; c.x+=c.dir*c.sp*dt; if(c.x>W-40) c.dir=-1; if(c.x<40) c.dir=1;
  const y=sandY+6+Math.abs(Math.sin(t*6))*2;
  ctx.save(); ctx.translate(c.x,y); ctx.scale(c.dir,1);
  ctx.fillStyle='#E06A4C'; ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.lineCap='round';
  // лапки
  for(let i=-1;i<=1;i++){ ctx.strokeStyle=INK; ctx.beginPath(); ctx.moveTo(i*7,3); ctx.lineTo(i*10-6,10+Math.sin(t*6+i)*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i*7,3); ctx.lineTo(i*10+6,10+Math.cos(t*6+i)*2); ctx.stroke(); }
  // клешни
  ctx.fillStyle='#E06A4C'; ctx.strokeStyle=INK;
  ctx.beginPath(); ctx.arc(-16,-1,5,0,6.28); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(16,-1,5,0,6.28); ctx.fill(); ctx.stroke();
  // тело
  ctx.beginPath(); ctx.ellipse(0,0,14,9,0,0,6.28); ctx.fill(); ctx.stroke();
  // глазки
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-7,2.6,0,6.28); ctx.arc(4,-7,2.6,0,6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(-4,-7,1.1,0,6.28); ctx.arc(4,-7,1.1,0,6.28); ctx.fill();
  ctx.restore();
}

// ---------- Рыбки (векторные модельки) ----------
let swimmers=[];
// нижняя граница боковой панели кнопок (4 круглые кнопки по 52px с зазором 12px)
const sideZoneBottom = () => 118 + 4*52 + 3*12 + 26;
function spawnSwimmer(f, atX, atY){
  const lane=swimmers.length, lanes=Math.max(4, LEVELS.length);
  const top=H*0.26, bot=sandY-46;
  const y=(atY!=null)?atY: top + ((lane+0.5)/lanes)*(bot-top) + rr(-8,8);
  const x=(atX!=null)?atX: W*(0.14 + ((lane*0.37)%1)*0.72) + rr(-12,12);
  swimmers.push({ f, x:Math.max(W*0.1,Math.min(W*0.9,x)), y:Math.max(top,Math.min(bot,y)),
    get sp(){ return LV(this.f.lvl); },  // drawFish берёт описание уровня
    dir:Math.random()<0.5?1:-1, spd:rr(26,44), phase:rr(0,6.28), eat:0, eatCd:0, pop:0 });
}
function rebuildSwimmers(){ swimmers=[]; S.tank.forEach(f=>spawnSwimmer(f)); }
// масштаб рыбки: малёк меньше взрослого
const fishScale = f => 0.45 + 0.55*f.g;

let food=[];   // хлопья корма: тонут, рыбки едят их и наполняют сытость
function spawnFood(n){
  for(let i=0;i<n;i++){
    const fx=rr(W*0.15,W*0.85);
    food.push({ x:fx, y:rr(46,90), vy:rr(18,30), life:1 });
    if(i<4) ripple.push({x:fx,y:70,r:4,life:1});
  }
}
let ripple=[];
let popups=[]; // всплывающий текст «+N» над рыбками при сборе

// рост мальков: идёт у каждой рыбы аквариума, сытость ускоряет
function growFish(dt){
  S.tank.forEach(f=>{
    if(f.g>=1) return;
    const sp=(1+GROW_BOOST*Math.min(f.sat,1))/LV(f.lvl).grow;
    f.g=Math.min(1, f.g + sp*dt);
    if(f.g>=1){ // подрос — искры и «пух» у его спрайта
      const sw=swimmers.find(s=>s.f===f);
      if(sw){ sw.pop=1; for(let i=0;i<10;i++) sparks.push({x:sw.x+rr(-16,16), y:sw.y+rr(-14,14), life:1}); }
    }
  });
}
function updateWorld(t,dt){
  growFish(dt);
  // корм тонет
  for(let i=food.length-1;i>=0;i--){ const f=food[i]; f.y+=f.vy*dt; if(f.y>sandY-6){ f.life-=dt*1.5; if(f.life<=0) food.splice(i,1); } }
  // рыбки плавают + идут к ближайшему корму
  swimmers.forEach(s=>{
    if(s===dragSw) return; // перетаскиваемую ведёт палец
    s.phase+=dt*6;
    let tx=null,ty=null,best=1e9;
    if(food.length){ food.forEach(f=>{ const d=(f.x-s.x)**2+(f.y-s.y)**2; if(d<best){best=d; tx=f.x; ty=f.y;} }); }
    if(tx!=null && best<460*460){ // плывёт к корму
      const dx=tx-s.x, dy=ty-s.y, L=Math.hypot(dx,dy)||1;
      s.x+=dx/L*s.spd*2.1*dt; s.y+=dy/L*s.spd*2.1*dt; s.dir=dx<0?-1:1;
      if(L<16 && s.eatCd<=0){ // рыбка ест не спеша: один хлопик за раз, с паузой
        for(let i=food.length-1;i>=0;i--){ if(Math.abs(food[i].x-tx)<1&&Math.abs(food[i].y-ty)<1){ food.splice(i,1); break; } }
        s.f.sat=Math.min(1, s.f.sat+feedFill());
        s.eatCd=EAT_CD; s.eat=1; sparkle(s.x,s.y);
      }
    } else { // спокойное блуждание
      s.x+=s.dir*s.spd*dt*0.5;
      s.y+=Math.sin(t*1.3+s.phase)*8*dt;
      if(s.x>W*0.9){ s.dir=-1; } if(s.x<W*0.1){ s.dir=1; }
      s.y=Math.max(H*0.24, Math.min(sandY-34, s.y));
    }
    if(s.eat>0) s.eat=Math.max(0,s.eat-dt*2);
    if(s.eatCd>0) s.eatCd-=dt;
    if(s.pop>0) s.pop=Math.max(0,s.pop-dt*3);
  });
  // рыбки не заплывают под боковую панель кнопок — их плашки остаются видимыми
  swimmers.forEach(s=>{
    if(s.y < sideZoneBottom() && s.x > W-76){ s.x=W-76; s.dir=-1; }
  });
  // мягкое расталкивание: рыбки не слипаются, именные плашки остаются читаемыми
  const MINX=76, MINY=40, k=Math.min(1,dt*3);
  for(let i=0;i<swimmers.length;i++){
    for(let j=i+1;j<swimmers.length;j++){
      const a=swimmers[i], b=swimmers[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      if(Math.abs(dx)>=MINX || Math.abs(dy)>=MINY) continue;
      const py=(MINY-Math.abs(dy))*0.5*(dy<0?-1:1)*k;
      a.y-=py; b.y+=py;
      const px=(MINX-Math.abs(dx))*0.25*(dx<0?-1:1)*k;
      a.x-=px; b.x+=px;
      a.y=Math.max(H*0.24, Math.min(sandY-34, a.y));
      b.y=Math.max(H*0.24, Math.min(sandY-34, b.y));
      a.x=Math.max(W*0.08, Math.min(W*0.92, a.x));
      b.x=Math.max(W*0.08, Math.min(W*0.92, b.x));
    }
  }
  for(let i=ripple.length-1;i>=0;i--){ const r=ripple[i]; r.r+=40*dt; r.life-=dt*2; if(r.life<=0) ripple.splice(i,1); }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.y-=20*dt; s.life-=dt*1.6; if(s.life<=0) sparks.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.y+=p.vy*dt; p.life-=dt*1.2; if(p.life<=0) popups.splice(i,1); }
}
let sparks=[];
function sparkle(x,y){ for(let i=0;i<4;i++) sparks.push({x:x+rr(-8,8),y:y+rr(-8,8),life:1}); }

// ── Цветовые хелперы для объёмных моделек ──
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function shade(hex, amt){ const [r,g,b]=hexRgb(hex);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')'; }
function rgbaC(hex, a){ const [r,g,b]=hexRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }
// вертикальный градиент тела: свет сверху, глубина снизу
function bodyGrad(g,c1,bh){ const gr=g.createLinearGradient(0,-bh,0,bh);
  gr.addColorStop(0,shade(c1,0.42)); gr.addColorStop(0.5,c1); gr.addColorStop(1,shade(c1,-0.3)); return gr; }
// лучики на плавнике: веер линий из точки (x0,y0)
function finRays(g,x0,y0,pts,alpha){ g.save(); g.strokeStyle='rgba(20,40,60,'+alpha+')'; g.lineWidth=1.4;
  pts.forEach(p=>{ g.beginPath(); g.moveTo(x0,y0); g.quadraticCurveTo((x0+p[0])/2,(y0+p[1])/2-2,p[0],p[1]); g.stroke(); });
  g.restore(); }
// глаз с радужкой и двойным бликом
function fishEye(g,x,y,r,iris){
  g.fillStyle='#FFFFFF'; g.strokeStyle=INK; g.lineWidth=2;
  g.beginPath(); g.arc(x,y,r,0,6.28); g.fill(); g.stroke();
  g.fillStyle=iris; g.beginPath(); g.arc(x+r*0.18,y,r*0.66,0,6.28); g.fill();
  g.fillStyle=INK; g.beginPath(); g.arc(x+r*0.22,y,r*0.4,0,6.28); g.fill();
  g.fillStyle='#fff'; g.beginPath(); g.arc(x-r*0.12,y-r*0.28,r*0.22,0,6.28); g.fill();
  g.beginPath(); g.arc(x+r*0.3,y+r*0.22,r*0.11,0,6.28); g.fill();
}
// светлое брюшко + мягкий блик по спинке внутри произвольной формы (вызывать в clip)
function bellyLight(g,bw,bh){
  const bg=g.createLinearGradient(0,0,0,bh);
  bg.addColorStop(0,'rgba(255,255,255,0)'); bg.addColorStop(1,'rgba(255,255,255,0.42)');
  g.fillStyle=bg; g.fillRect(-bw*1.2,0,bw*2.4,bh*1.2);
  g.fillStyle='rgba(255,255,255,0.22)';
  g.beginPath(); g.ellipse(-bw*0.05,-bh*0.62,bw*0.7,bh*0.3,0.06,0,6.28); g.fill();
}

// универсальная отрисовка рыбки: g — контекст, sp — вид, (cx,cy) центр, scale, dir, wag[-1..1]
function drawFish(g, sp, cx, cy, scale, dir, wag){
  g.save(); g.translate(cx,cy); g.scale(dir*scale, scale);
  g.lineJoin='round'; g.lineCap='round';
  const S=sp.shape, ink=INK;
  const stroke=()=>{ g.strokeStyle=ink; g.lineWidth=3; g.stroke(); };

  if(S==='guppy'){ // ── Пузырик: малёк с огромным веерным хвостом в горошек ──
    const bw=14,bh=9;
    g.save(); g.translate(-bw+3,0); g.rotate(wag*0.3); // хвост-веер
    const tg=g.createRadialGradient(0,0,2,0,0,20);
    tg.addColorStop(0,shade(sp.c2,0.2)); tg.addColorStop(1,sp.c2);
    g.fillStyle=tg; g.beginPath(); g.moveTo(0,0);
    g.quadraticCurveTo(-10,-16,-19,-13); g.quadraticCurveTo(-22,0,-19,13);
    g.quadraticCurveTo(-10,16,0,0); g.closePath(); g.fill(); stroke();
    finRays(g,0,0,[[-17,-10],[-20,-3],[-20,4],[-16,11]],0.3);
    g.fillStyle=rgbaC(sp.c1,0.9);
    [[-9,-6],[-14,-1],[-9,6],[-15,-8],[-16,7]].forEach(p=>{ g.beginPath(); g.arc(p[0],p[1],1.8,0,6.28); g.fill(); });
    g.restore();
    // спинной флажок
    g.fillStyle=rgbaC(sp.c2,0.95);
    g.beginPath(); g.moveTo(-6,-bh+2); g.quadraticCurveTo(-2,-bh-8,6,-bh-5); g.quadraticCurveTo(7,-bh+1,8,-bh+3); g.closePath(); g.fill(); stroke();
    // тело
    g.fillStyle=bodyGrad(g,sp.c1,bh);
    g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill(); stroke();
    g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip(); bellyLight(g,bw,bh);
    g.fillStyle=rgbaC(sp.c2,0.5); g.beginPath(); g.ellipse(-7,0,5,bh*0.8,0,0,6.28); g.fill();
    g.restore();
    g.save(); g.translate(1,3); g.rotate(0.25+wag*0.2); // грудной
    g.fillStyle=rgbaC(sp.c2,0.9); g.beginPath(); g.ellipse(0,0,5.5,3,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2; g.stroke(); g.restore();
    fishEye(g,7,-2.5,3.6,'#3E86B0');
    g.fillStyle='rgba(255,120,140,0.35)'; g.beginPath(); g.ellipse(9,2.5,2.4,1.6,0,0,6.28); g.fill(); // щёчка
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1.5,1.5,2,-0.4,0.9); g.stroke();
  }
  else if(S==='gold'){ // ── Персик: золотая рыбка с текучим двойным хвостом ──
    const bw=17,bh=13;
    g.save(); g.translate(-bw+4,0); g.rotate(wag*0.3);
    const tg=bodyGrad(g,sp.c1,16);
    g.fillStyle=tg;
    g.beginPath(); g.moveTo(0,0); // верхняя вуаль
    g.bezierCurveTo(-8,-6,-12,-18,-22,-15);
    g.bezierCurveTo(-18,-9,-20,-6,-14,-3);
    g.bezierCurveTo(-18,-1,-10,-1,0,0); g.closePath(); g.fill(); stroke();
    g.beginPath(); g.moveTo(0,0); // нижняя вуаль
    g.bezierCurveTo(-8,6,-14,16,-23,12);
    g.bezierCurveTo(-18,7,-19,4,-13,2);
    g.bezierCurveTo(-17,0,-9,1,0,0); g.closePath(); g.fill(); stroke();
    finRays(g,0,0,[[-18,-12],[-13,-5],[-14,4],[-19,10]],0.25);
    g.restore();
    // спинной гребень
    g.fillStyle=bodyGrad(g,sp.c2,bh+9);
    g.beginPath(); g.moveTo(-8,-bh+3); g.quadraticCurveTo(-3,-bh-9,4,-bh-6); g.quadraticCurveTo(8,-bh-2,10,-bh+4); g.closePath(); g.fill(); stroke();
    // тело
    g.fillStyle=bodyGrad(g,sp.c1,bh);
    g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill(); stroke();
    g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip();
    bellyLight(g,bw,bh);
    // чешуйки-полумесяцы
    g.strokeStyle='rgba(200,90,20,0.28)'; g.lineWidth=1.6;
    for(let row=-1;row<=1;row++) for(let col=-2;col<=1;col++){
      g.beginPath(); g.arc(col*7+((row+2)%2)*3.5,row*6,4.4,0.5,2.64); g.stroke(); }
    g.restore();
    g.save(); g.translate(2,4); g.rotate(0.3+wag*0.25);
    g.fillStyle=rgbaC(sp.c2,0.95); g.beginPath(); g.moveTo(0,0);
    g.quadraticCurveTo(4,8,-2,11); g.quadraticCurveTo(-6,6,-4,1); g.closePath(); g.fill();
    g.strokeStyle=ink; g.lineWidth=2; g.stroke(); g.restore();
    fishEye(g,8.5,-3.5,4,'#8A4B18');
    g.fillStyle='rgba(255,120,120,0.3)'; g.beginPath(); g.ellipse(11,2,2.6,1.8,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1,2,2.6,-0.4,1.0); g.stroke();
  }
  else if(S==='neon'){ // ── Нео: неоновая тетра со светящейся полосой ──
    const bw=19,bh=8;
    g.save(); g.translate(-bw+3,0); g.rotate(wag*0.4); // вильчатый хвостик
    g.fillStyle=rgbaC('#D9EFF7',0.85);
    g.beginPath(); g.moveTo(0,0); g.lineTo(-11,-9); g.quadraticCurveTo(-6,-2,-8,0);
    g.quadraticCurveTo(-6,2,-11,9); g.closePath(); g.fill(); stroke();
    g.restore();
    g.fillStyle=rgbaC('#D9EFF7',0.8); // прозрачный спинной
    g.beginPath(); g.moveTo(-4,-bh+2); g.quadraticCurveTo(0,-bh-6,6,-bh+1); g.closePath(); g.fill();
    g.strokeStyle=ink; g.lineWidth=2.4; g.stroke();
    // серебристое тело
    const sg=g.createLinearGradient(0,-bh,0,bh);
    sg.addColorStop(0,'#C8DEE8'); sg.addColorStop(0.5,'#E8F3F7'); sg.addColorStop(1,'#9FBECC');
    g.fillStyle=sg;
    g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill(); stroke();
    g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip();
    // неоновая полоса с сиянием
    const ng=g.createLinearGradient(0,-4.5,0,-0.5);
    ng.addColorStop(0,'#7FF7EF'); ng.addColorStop(0.5,'#2FD6E8'); ng.addColorStop(1,'#1FA6C9');
    g.fillStyle=ng; g.fillRect(-bw,-4.5,bw*2,4);
    g.globalCompositeOperation='lighter';
    g.fillStyle='rgba(120,240,255,0.35)'; g.beginPath(); g.ellipse(2,-2.5,bw*0.85,4,0,0,6.28); g.fill();
    g.globalCompositeOperation='source-over';
    // красная полоса задней половины
    const rg=g.createLinearGradient(0,0,0,5);
    rg.addColorStop(0,'#FF5A6E'); rg.addColorStop(1,'#C42B48');
    g.fillStyle=rg; g.beginPath();
    g.moveTo(-bw,0); g.lineTo(2,0); g.quadraticCurveTo(4,2.5,2,5); g.lineTo(-bw,5); g.closePath(); g.fill();
    bellyLight(g,bw,bh);
    g.restore();
    g.fillStyle=rgbaC('#D9EFF7',0.85);
    g.save(); g.translate(3,4); g.rotate(0.3+wag*0.2);
    g.beginPath(); g.ellipse(0,0,4.5,2.4,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=1.8; g.stroke(); g.restore();
    fishEye(g,11,-1.5,3.4,'#20B7CE');
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1,1,1.8,-0.4,0.9); g.stroke();
  }
  else if(S==='clown'){ // ── Пятныш: клоун с белыми лентами в чернильной окантовке ──
    const bw=18,bh=12;
    g.save(); g.translate(-bw+4,0); g.rotate(wag*0.32); // округлый хвост с тёмной кромкой
    g.fillStyle=bodyGrad(g,sp.c1,12);
    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(-7,-11,-14,-9);
    g.quadraticCurveTo(-17,0,-14,9); g.quadraticCurveTo(-7,11,0,0); g.closePath(); g.fill(); stroke();
    g.strokeStyle='rgba(30,20,10,0.55)'; g.lineWidth=2.6;
    g.beginPath(); g.moveTo(-13,-8.5); g.quadraticCurveTo(-16,0,-13,8.5); g.stroke();
    g.restore();
    // спинной с чёрной кромкой
    g.fillStyle=bodyGrad(g,sp.c1,bh+7);
    g.beginPath(); g.moveTo(-8,-bh+3); g.quadraticCurveTo(-2,-bh-8,7,-bh+1); g.closePath(); g.fill(); stroke();
    g.strokeStyle='rgba(30,20,10,0.5)'; g.lineWidth=2.2;
    g.beginPath(); g.moveTo(-7,-bh+1); g.quadraticCurveTo(-2,-bh-6,6,-bh); g.stroke();
    // тело
    g.fillStyle=bodyGrad(g,sp.c1,bh);
    g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill(); stroke();
    g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip();
    // белые ленты с окантовкой
    g.fillStyle='#FFFFFF'; g.strokeStyle='rgba(30,20,10,0.6)'; g.lineWidth=1.8;
    [[9,4.2],[-3,5.2],[-13,4]].forEach(b=>{
      g.beginPath();
      g.moveTo(b[0]-b[1],-bh); g.quadraticCurveTo(b[0]-b[1]-2.5,0,b[0]-b[1],bh);
      g.lineTo(b[0]+b[1],bh); g.quadraticCurveTo(b[0]+b[1]-2.5,0,b[0]+b[1],-bh);
      g.closePath(); g.fill(); g.stroke();
    });
    bellyLight(g,bw,bh);
    g.restore();
    g.save(); g.translate(2,4); g.rotate(0.3+wag*0.25);
    g.fillStyle=bodyGrad(g,sp.c1,6); g.beginPath(); g.ellipse(0,0,6.5,3.6,0,0,6.28); g.fill();
    g.strokeStyle='rgba(30,20,10,0.55)'; g.lineWidth=2.2; g.stroke(); g.restore();
    fishEye(g,9.5,-3,3.8,'#B0521A');
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1,2,2.4,-0.4,1.0); g.stroke();
  }
  else if(S==='molly'){ // ── Уголёк: тёмная рыбка с тлеющим свечением у хвоста ──
    const bw=18,bh=11;
    g.save(); g.translate(-bw+3,0); g.rotate(wag*0.34);
    const tg=g.createLinearGradient(0,0,-16,0);
    tg.addColorStop(0,'#F2913D'); tg.addColorStop(0.5,'#C4552E'); tg.addColorStop(1,'#4A4A57');
    g.fillStyle=tg;
    g.beginPath(); g.moveTo(0,0); g.lineTo(-14,-11); g.quadraticCurveTo(-9,0,-14,11); g.closePath(); g.fill(); stroke();
    finRays(g,0,0,[[-12,-8],[-11,0],[-12,8]],0.35);
    g.restore();
    g.fillStyle='#3A3A46'; // спинной
    g.beginPath(); g.moveTo(-7,-bh+2); g.quadraticCurveTo(-1,-bh-8,7,-bh+2); g.closePath(); g.fill(); stroke();
    // тело: угольный градиент
    const cg=g.createLinearGradient(0,-bh,0,bh);
    cg.addColorStop(0,'#6E6E80'); cg.addColorStop(0.5,sp.c1); cg.addColorStop(1,'#26262E');
    g.fillStyle=cg;
    g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill(); stroke();
    g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip();
    // тлеющий градиент к хвосту
    const eg=g.createRadialGradient(-bw*0.75,1,1,-bw*0.75,1,14);
    eg.addColorStop(0,'rgba(242,145,61,0.8)'); eg.addColorStop(1,'rgba(242,145,61,0)');
    g.fillStyle=eg; g.fillRect(-bw,-bh,bw,bh*2);
    // искорки на боку
    g.fillStyle='rgba(255,190,110,0.7)';
    [[-10,-3],[-13,3],[-7,4]].forEach(p=>{ g.beginPath(); g.arc(p[0],p[1],1.1,0,6.28); g.fill(); });
    g.fillStyle='rgba(255,255,255,0.14)';
    g.beginPath(); g.ellipse(0,-bh*0.55,bw*0.75,bh*0.32,0.05,0,6.28); g.fill();
    g.restore();
    g.save(); g.translate(2,4); g.rotate(0.3+wag*0.22);
    g.fillStyle='#55555F'; g.beginPath(); g.ellipse(0,0,5.5,3,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2; g.stroke(); g.restore();
    fishEye(g,9,-3,3.6,'#F2913D');
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1,1.5,2.2,-0.4,0.9); g.stroke();
  }
  else if(S==='tang'){ // ── Небо: хирург-диск с тёмным росчерком и жёлтым хвостом ──
    const bw=18,bh=15;
    g.save(); g.translate(-bw+4,0); g.rotate(wag*0.3); // жёлтый клин-хвост
    const yg=g.createLinearGradient(0,-10,0,10);
    yg.addColorStop(0,shade(sp.c2,0.3)); yg.addColorStop(1,shade(sp.c2,-0.15));
    g.fillStyle=yg;
    g.beginPath(); g.moveTo(1,-5); g.lineTo(-12,-10); g.quadraticCurveTo(-8,0,-12,10); g.lineTo(1,5); g.closePath(); g.fill(); stroke();
    g.restore();
    // тело-диск
    g.fillStyle=bodyGrad(g,sp.c1,bh);
    g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.fill(); stroke();
    // спинной/анальный гребни вдоль корпуса
    g.fillStyle=shade(sp.c1,-0.28);
    g.beginPath(); g.moveTo(-12,-bh*0.62); g.quadraticCurveTo(0,-bh-5.5,12,-bh*0.55); g.quadraticCurveTo(2,-bh*0.72,-12,-bh*0.62); g.closePath(); g.fill(); stroke();
    g.beginPath(); g.moveTo(-12,bh*0.62); g.quadraticCurveTo(0,bh+5.5,12,bh*0.55); g.quadraticCurveTo(2,bh*0.72,-12,bh*0.62); g.closePath(); g.fill(); stroke();
    g.save(); g.beginPath(); g.ellipse(0,0,bw,bh,0,0,6.28); g.clip();
    // тёмный «росчерк-палитра»
    g.fillStyle='rgba(16,34,64,0.75)';
    g.beginPath(); g.moveTo(10,-bh*0.7);
    g.quadraticCurveTo(-8,-bh*0.35,-13,2); g.quadraticCurveTo(-8,4,-2,3);
    g.quadraticCurveTo(-6,-2,4,-bh*0.32); g.quadraticCurveTo(9,-bh*0.5,10,-bh*0.7);
    g.closePath(); g.fill();
    bellyLight(g,bw,bh);
    g.restore();
    g.save(); g.translate(3,4); g.rotate(0.32+wag*0.22);
    g.fillStyle=shade(sp.c2,0.1); g.beginPath(); g.ellipse(0,0,6,3.4,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2; g.stroke(); g.restore();
    fishEye(g,9.5,-4.5,3.8,'#16385E');
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-1,1.5,2.2,-0.4,0.9); g.stroke();
  }
  else if(S==='cat'){ // ── Уса: усатый сомик с плоским брюшком и крапом ──
    const bw=27,bh=12;
    g.save(); g.translate(-bw+5,2); g.rotate(wag*0.3);
    g.fillStyle=bodyGrad(g,sp.c1,10);
    g.beginPath(); g.moveTo(0,0); g.lineTo(-12,-10); g.quadraticCurveTo(-7,-1,-12,7); g.closePath(); g.fill(); stroke();
    g.restore();
    // спинной парус
    g.fillStyle=bodyGrad(g,sp.c2,bh+8);
    g.beginPath(); g.moveTo(-9,-bh+4); g.quadraticCurveTo(-4,-bh-9,3,-bh-7); g.lineTo(7,-bh+4); g.closePath(); g.fill(); stroke();
    // корпус: горбатая спинка, плоское брюшко
    const bodyPath=()=>{ g.beginPath();
      g.moveTo(bw,4);
      g.quadraticCurveTo(bw*0.9,-6,bw*0.45,-bh+2);
      g.quadraticCurveTo(0,-bh-3,-bw*0.55,-bh+4);
      g.quadraticCurveTo(-bw,-2,-bw+2,5);
      g.quadraticCurveTo(-bw*0.3,8.5,bw*0.5,7.5);
      g.quadraticCurveTo(bw*0.9,7,bw,4);
      g.closePath(); };
    g.fillStyle=bodyGrad(g,sp.c1,bh);
    bodyPath(); g.fill(); stroke();
    g.save(); bodyPath(); g.clip();
    // кремовое брюшко
    const bg2=g.createLinearGradient(0,2,0,9);
    bg2.addColorStop(0,'rgba(240,225,195,0)'); bg2.addColorStop(1,'rgba(240,225,195,0.85)');
    g.fillStyle=bg2; g.fillRect(-bw,2,bw*2,8);
    // крап
    g.fillStyle='rgba(70,50,30,0.4)';
    [[-14,-4],[-6,-7],[3,-5],[12,-3],[-10,1],[1,-1],[9,2],[-18,-1],[17,-5],[-2,-8.5]].forEach(p=>{
      g.beginPath(); g.ellipse(p[0],p[1],2.1,1.6,0.4,0,6.28); g.fill(); });
    g.fillStyle='rgba(255,255,255,0.16)';
    g.beginPath(); g.ellipse(0,-bh*0.5,bw*0.8,bh*0.32,0,0,6.28); g.fill();
    g.restore();
    g.save(); g.translate(4,6); g.rotate(0.35+wag*0.2);
    g.fillStyle=bodyGrad(g,sp.c2,4); g.beginPath(); g.ellipse(0,0,7,3.8,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2.2; g.stroke(); g.restore();
    // усы (две пары, колышутся)
    g.strokeStyle=ink; g.lineWidth=2.2;
    g.beginPath(); g.moveTo(bw-3,2); g.quadraticCurveTo(bw+7,4+wag*2,bw+13,1+wag*3); g.stroke();
    g.beginPath(); g.moveTo(bw-3,4.5); g.quadraticCurveTo(bw+7,9+wag*2,bw+14,8+wag*3); g.stroke();
    g.lineWidth=1.7;
    g.beginPath(); g.moveTo(bw-6,6); g.quadraticCurveTo(bw,11+wag*1.5,bw+5,12+wag*2); g.stroke();
    fishEye(g,bw*0.52,-5,3.4,'#6E4E2E');
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw-3,6.5,2.6,0.2,1.4); g.stroke();
  }
  else if(S==='angel'){ // ── Королёк: скалярия с высокими парусами и вымпелами ──
    const bw=13,bh=15;
    g.save(); g.translate(-bw-1,0); g.rotate(wag*0.3); // небольшой хвост
    g.fillStyle=rgbaC(sp.c1,0.95);
    g.beginPath(); g.moveTo(2,-5); g.quadraticCurveTo(-9,-8,-11,-6); g.quadraticCurveTo(-7,0,-11,6);
    g.quadraticCurveTo(-9,8,2,5); g.closePath(); g.fill(); stroke();
    g.restore();
    // высокий спинной парус + вымпел
    const fg=g.createLinearGradient(0,-bh-16,0,0);
    fg.addColorStop(0,shade(sp.c2,0.25)); fg.addColorStop(1,sp.c2);
    g.fillStyle=fg;
    g.beginPath(); g.moveTo(-6,-bh+4);
    g.quadraticCurveTo(-2,-bh-14,7,-bh-15);
    g.quadraticCurveTo(6,-bh-4,9,-bh+6); g.closePath(); g.fill(); stroke();
    // анальный парус
    g.beginPath(); g.moveTo(-6,bh-4);
    g.quadraticCurveTo(-2,bh+14,7,bh+15);
    g.quadraticCurveTo(6,bh+4,9,bh-6); g.closePath(); g.fill(); stroke();
    // брюшные вымпелы-нити
    g.strokeStyle=shade(sp.c2,-0.1); g.lineWidth=2.2;
    g.beginPath(); g.moveTo(4,bh-6); g.quadraticCurveTo(8+wag*2,bh+8,4+wag*3,bh+16); g.stroke();
    g.beginPath(); g.moveTo(1,bh-5); g.quadraticCurveTo(4+wag*2,bh+6,0+wag*3,bh+13); g.stroke();
    // ромбовидное тело
    const bodyPath=()=>{ g.beginPath();
      g.moveTo(bw+2,0);
      g.quadraticCurveTo(bw*0.7,-bh*0.9,0,-bh);
      g.quadraticCurveTo(-bw*0.9,-bh*0.55,-bw,0);
      g.quadraticCurveTo(-bw*0.9,bh*0.55,0,bh);
      g.quadraticCurveTo(bw*0.7,bh*0.9,bw+2,0);
      g.closePath(); };
    g.fillStyle=bodyGrad(g,sp.c1,bh);
    bodyPath(); g.fill(); stroke();
    g.save(); bodyPath(); g.clip();
    // тёмные вертикальные ленты
    g.fillStyle=rgbaC(sp.c2,0.8);
    [[3,2.6],[-5,3.2]].forEach(b=>{
      g.beginPath();
      g.moveTo(b[0]-b[1],-bh); g.quadraticCurveTo(b[0]-b[1]-2,0,b[0]-b[1],bh);
      g.lineTo(b[0]+b[1],bh); g.quadraticCurveTo(b[0]+b[1]-2,0,b[0]+b[1],-bh);
      g.closePath(); g.fill(); });
    bellyLight(g,bw,bh);
    g.restore();
    fishEye(g,7,-4,3.6,'#C4402E');
    g.strokeStyle=ink; g.lineWidth=2; g.beginPath(); g.arc(bw,2,2,-0.4,0.9); g.stroke();
  }
  else if(S==='puffer'){ // ── Пуфик: круглый иглобрюх с шипами и пузиком ──
    const R=18;
    g.save(); g.translate(-R+2,0); g.rotate(wag*0.4); // мини-хвостик
    g.fillStyle=bodyGrad(g,sp.c1,8);
    g.beginPath(); g.moveTo(2,0); g.lineTo(-9,-7); g.quadraticCurveTo(-6,0,-9,7); g.closePath(); g.fill(); stroke();
    g.restore();
    // шипы по кругу (кроме брюшка)
    g.fillStyle=shade(sp.c1,-0.1);
    for(let i=0;i<10;i++){
      const an=Math.PI*(-0.92+i*0.19);
      const sx=Math.cos(an)*R*0.95, sy=Math.sin(an)*R*0.95;
      const tx=Math.cos(an)*(R+6.5), ty=Math.sin(an)*(R+6.5);
      const px=Math.cos(an+1.5708)*3, py=Math.sin(an+1.5708)*3;
      g.beginPath(); g.moveTo(sx-px,sy-py); g.lineTo(tx,ty); g.lineTo(sx+px,sy+py); g.closePath(); g.fill();
      g.strokeStyle=ink; g.lineWidth=2.2; g.stroke();
    }
    // круглое тело
    g.fillStyle=bodyGrad(g,sp.c1,R);
    g.beginPath(); g.arc(0,0,R,0,6.28); g.fill(); stroke();
    g.save(); g.beginPath(); g.arc(0,0,R,0,6.28); g.clip();
    // кремовое пузико с точками
    const pg=g.createLinearGradient(0,2,0,R);
    pg.addColorStop(0,'rgba(248,244,214,0)'); pg.addColorStop(0.45,'rgba(248,244,214,0.95)');
    g.fillStyle=pg; g.fillRect(-R,0,R*2,R);
    g.fillStyle='rgba(150,140,80,0.35)';
    [[-8,11],[-2,14],[5,12],[10,9],[-12,8]].forEach(p=>{ g.beginPath(); g.arc(p[0],p[1],1.4,0,6.28); g.fill(); });
    g.fillStyle='rgba(255,255,255,0.25)';
    g.beginPath(); g.ellipse(-3,-R*0.55,R*0.6,R*0.3,0.1,0,6.28); g.fill();
    g.restore();
    g.save(); g.translate(0,3); g.rotate(0.3+wag*0.3); // мини-крылышко
    g.fillStyle=shade(sp.c2,-0.05); g.beginPath(); g.ellipse(0,0,5.5,3,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2; g.stroke(); g.restore();
    fishEye(g,8,-5,4.4,'#5E7A2E');
    g.fillStyle='rgba(255,140,120,0.3)'; g.beginPath(); g.ellipse(12,2,2.6,1.8,0,0,6.28); g.fill();
    g.strokeStyle=ink; g.lineWidth=2.2; g.beginPath(); g.arc(R-3,3,2.8,0.3,1.6); g.stroke();
  }
  else { // запасной силуэт (на случай нового вида без модели)
    g.fillStyle=bodyGrad(g,sp.c1,14);
    g.beginPath(); g.ellipse(0,0,20,13,0,0,6.28); g.fill(); stroke();
    g.fillStyle=sp.c2; g.beginPath(); g.moveTo(-18,0); g.lineTo(-30,-11); g.quadraticCurveTo(-24,0,-30,11); g.closePath(); g.fill(); stroke();
    fishEye(g,10,-3,3.8,'#3E86B0');
  }
  g.restore();
}
function drawSwimmers(t){
  swimmers.forEach(s=>{
    const wag=Math.sin(s.phase);
    const f=s.f, gscale=fishScale(f);
    const pop=1+0.12*s.pop+(s.eat>0?0.06*Math.sin(t*30):0);
    const sc=0.9*gscale*pop;
    // подсветка валидной цели слияния под пальцем
    if(dragSw && s!==dragSw && canMerge(dragSw,s)){
      const near=Math.hypot(dragSw.x-s.x, dragSw.y-s.y)<70;
      ctx.save();
      ctx.strokeStyle=near?'#F2C14E':'rgba(242,193,78,0.6)';
      ctx.lineWidth=near?4:2.5; ctx.setLineDash(near?[]:[6,5]);
      ctx.beginPath(); ctx.arc(s.x, s.y, 40*gscale+8, 0, 6.28); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    if(s===dragSw){ ctx.globalAlpha=0.9; }
    drawFish(ctx, LV(f.lvl), s.x, s.y, sc, s.dir, wag);
    ctx.restore();
    // над рыбкой — только компактная шкала (у малька рост, у взрослой сытость), без имени
    const adult=grown(f), sated=isSated(f);
    const bw2=Math.max(26, 46*gscale), bh2=6, ny=s.y-30*gscale-10;
    const val=adult? f.sat : f.g;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(16,34,50,0.5)';
    roundRect(ctx, s.x-bw2/2, ny, bw2, bh2, 3); ctx.fill();
    if(val>0.02){
      ctx.fillStyle=!adult? '#8FD0F0' : (sated?'#F2C14E':'#7FD1AE');
      roundRect(ctx, s.x-bw2/2, ny, bw2*val, bh2, 3); ctx.fill();
    }
    ctx.strokeStyle='rgba(251,246,233,0.8)'; ctx.lineWidth=1.4;
    roundRect(ctx, s.x-bw2/2, ny, bw2, bh2, 3); ctx.stroke();
    if(adult && !sated){ // риска порога сытости: докорми до неё — начнётся ×2
      const tx=s.x-bw2/2+bw2*SAT_FULL;
      ctx.strokeStyle='rgba(242,193,78,0.95)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(tx,ny-1); ctx.lineTo(tx,ny+bh2+1); ctx.stroke();
    }
    if(adult && sated){
      ctx.font='900 11px Nunito, sans-serif';
      ctx.lineWidth=3; ctx.strokeStyle=PAPER; ctx.strokeText('×2', s.x+bw2/2+11, ny+3);
      ctx.fillStyle='#C99A2E'; ctx.fillText('×2', s.x+bw2/2+11, ny+3);
    }
  });
}
function drawPopups(){
  popups.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.font='900 14px Nunito, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(251,246,233,0.9)'; ctx.strokeText(p.txt,p.x,p.y);
    ctx.fillStyle=p.gold?'#C99A2E':INK; ctx.fillText(p.txt,p.x,p.y);
  });
  ctx.globalAlpha=1;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function drawFood(){
  ctx.fillStyle='#C98A3E'; ctx.strokeStyle=INK; ctx.lineWidth=1.5;
  food.forEach(f=>{ ctx.globalAlpha=Math.max(0,f.life); ctx.beginPath(); ctx.arc(f.x,f.y,2.6,0,6.28); ctx.fill(); ctx.stroke(); ctx.globalAlpha=1; });
  ripple.forEach(r=>{ ctx.globalAlpha=Math.max(0,r.life)*0.6; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,6.28); ctx.stroke(); ctx.globalAlpha=1; });
  sparks.forEach(s=>{ ctx.globalAlpha=Math.max(0,s.life); ctx.fillStyle='#F7EAB0'; ctx.beginPath(); ctx.arc(s.x,s.y,2.2,0,6.28); ctx.fill(); ctx.globalAlpha=1; });
}

// ---------- Главный цикл ----------
let lastT=performance.now(), acc=0, tSec=0;
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now; tSec+=dt;
  acc+=dt;
  if(acc>=1){ const t=Math.floor(acc); acc-=t;
    S.tank.forEach(f=>{ if(f.sat>0) f.sat=Math.max(0, f.sat-SAT_DECAY*t); }); // сытость тает
    if(ips()>0) S.coins+=ips()*t;
    refreshHud(); persist();
  }
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawRays(tSec);
  drawCaustics(tSec);
  drawMotes(tSec,dt);
  drawWeeds(tSec);
  drawJelly(tSec,dt);
  updateWorld(tSec,dt);
  drawSwimmers(tSec);
  drawFood();
  drawPopups();
  drawBubbles(tSec,dt);
  drawCrab(tSec,dt);
  requestAnimationFrame(frame);
}

// ---------- Ввод: тап по рыбке, перетаскивание для слияния ----------
let dragSw=null, downSw=null, downX=0, downY=0, moved=false;
function fishAt(x,y){
  let best=null, bestD=1e9;
  swimmers.forEach(s=>{
    const r=46*fishScale(s.f);            // радиус попадания растёт вместе с рыбкой
    const d=Math.hypot(s.x-x, s.y-y);
    if(d<r && d<bestD){ best=s; bestD=d; }
  });
  return best;
}
function onDown(e){
  if(modalOpen) return;
  downX=e.clientX; downY=e.clientY; moved=false;
  downSw=fishAt(downX,downY);
  dragSw=null;
}
function onMove(e){
  if(modalOpen || !downSw) return;
  if(!moved && Math.hypot(e.clientX-downX, e.clientY-downY)>10){
    moved=true;
    if(grown(downSw.f) && downSw.f.lvl<MAXLVL) dragSw=downSw; // мержить можно только выросших
  }
  if(dragSw){ dragSw.x=e.clientX; dragSw.y=e.clientY; }
}
function onUp(e){
  if(modalOpen) return;
  if(dragSw){
    const target=swimmers.find(s=> s!==dragSw && canMerge(dragSw,s) && Math.hypot(s.x-e.clientX, s.y-e.clientY)<70);
    if(target) mergeFish(dragSw,target);
    dragSw=null; downSw=null; return;
  }
  if(downSw && !moved){                    // короткий тап по рыбке
    if(multiOn()) doCollect(e.clientX,e.clientY);
    else {
      tapFish(downSw);
      if(S.tut===0 && ++tutTaps>=3) tutAdvance(1);
      refreshHud(); persist(); sfx("coin");
    }
  } else if(!downSw){                      // тап по воде
    if(multiOn()) doCollect(e.clientX,e.clientY);
    else waterTap(e.clientX,e.clientY);
  }
  downSw=null;
}

// ---------- Тест-хуки ----------
window.render_game_to_text = () => JSON.stringify({
  coins:Math.floor(S.coins), lvl:maxLvl()+1, ips:ips(), upCost:upCost(),
  fish:S.tank.length, bought:S.bought, seen:S.seen.length,
  feed:S.feed, aer:S.aer, plant:S.plant,
  tapGain:tapGain(), best:S.best, x2:x2On(), multi:multiOn(),
  fishCost:fishCost(), foodCost:foodCost(), feedFill:feedFill(),
  shopLevels:LEVELS.map((lv,i)=>({lvl:i, open:unlocked(i), cost:fishCostAt(i)})),
  tank:S.tank.map(f=>({lvl:f.lvl, g:Math.round(f.g*1000)/1000, sat:Math.round(f.sat*1000)/1000})),
  grownCount:S.tank.filter(grown).length,
  satMin:Math.min(...S.tank.map(f=>f.sat)), tut:S.tut
});
window.advanceTime = ms => { S.coins += ips()*(ms/1000); refreshHud(); };
window.__grant = n => { S.coins+=n; refreshHud(); };
window.__buyFish = (lvl=0) => buyFish(lvl);
window.__buyNextFish = () => buyFish(0);         // совместимость со старым хуком
window.__fishCostAt = lvl => fishCostAt(lvl);
window.__unlocked = lvl => unlocked(lvl);
window.__buyUp = k => buyUp(k);
window.__feed = () => doFeed();
window.__tap = () => doCollect();                 // сбор со всех (как при мульти-тапе)
window.__tapFirst = () => { if(!swimmers.length) return 0; const g=tapFish(swimmers[0]); S.coins+=0; refreshHud(); return g; };
window.__sate = v => { S.tank.forEach(f=>{ f.sat=v; }); refreshHud(); };
window.__growAll = () => { S.tank.forEach(f=>{ f.g=1; }); refreshHud(); };
window.__mergeFirstPair = () => {
  for(let i=0;i<swimmers.length;i++) for(let j=i+1;j<swimmers.length;j++)
    if(canMerge(swimmers[i],swimmers[j])) return mergeFish(swimmers[i],swimmers[j]);
  return false;
};
window.__skipTut = () => tutAdvance(3);

// ---------- Boot ----------
function boot(raw){
  if(booted) return; booted=true;
  restore(raw);
  document.documentElement.setAttribute("lang", lang());
  resize(); rebuildSwimmers(); refreshHud();
  $("feedBtn").onclick  = doFeed;
  $("tutSkip").onclick  = ()=>tutAdvance(3);
  $("buyBtn").onclick   = buyFish;
  $("multiBtn").onclick = claimMulti;
  $("x2Btn").onclick    = claimX2;
  $("fishBtn").onclick  = ()=>openModal('fish');
  $("upBtn").onclick    = ()=>openModal('up');
  $("collBtn").onclick  = ()=>openModal('coll');
  $("langBtn").onclick  = toggleLang;
  $("mClose").onclick   = closeModal;
  $("modal").addEventListener('pointerdown', e=>{ if(e.target.id==='modal') closeModal(); });
  // ввод: короткий тап по рыбке = доход, перетаскивание = слияние, тап по воде = рябь
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', ()=>{ dragSw=null; });
  checkDaily();
  startMusic();
  setInterval(()=>refreshHud(), 1000); // обновляет таймер ×2 и цены
  requestAnimationFrame(frame);
  notifyGameReady(); // §1.19.2: готовность — после реальной загрузки игры
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        notifyGameReady(); // если boot уже прошёл по таймауту-страховке — сигналим готовность сейчас
        const pReady = sdk.getPlayer({scopes:false}).then(p=>{player=p;return p.getData(["save"]);})
          .then(d=>boot(d&&d.save?d.save:localRaw)).catch(()=>boot(localRaw));
        try{ lb = sdk.leaderboards; }catch(e){}
        return pReady;
      }).catch(()=>boot(localRaw));
      setTimeout(()=>boot(localRaw),4000);
    } else boot(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
</script>
